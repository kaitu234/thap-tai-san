    row=i=>`<div class="todo-i ${i.sev}"><span class="ii">${ic(i.icon||'alert','sm')}</span><div><b>${hiAmt(i.t,i.sev)}</b><span>${hiAmt(i.a,i.sev)}</span>
      <button class="snz" data-snooze="${encodeURIComponent(todoKey(i))}" data-days="${i.sev==='bad'?7:30}">Để sau ${i.sev==='bad'?7:30} ngày</button></div></div>`,
    foot=hid?`<p class="note" style="margin:8px 0 0">Đã để sau ${hid} việc. <button class="linkbtn" data-snooze="*">Hiện lại</button></p>`:'';
  return card('Việc cần làm','check',top.length?`<div class="todo">${top.map(row).join('')}</div>
    ${L.length>top.length?`<details class="more"><summary>Còn ${L.length-top.length} việc khác</summary><div class="todo">${L.slice(5).map(row).join('')}</div></details>`:''}${foot}
    <p style="margin:10px 0 0"><button class="btn ghost" data-goto="analysis">${ic('pulse','sm')} Xem phân tích đầy đủ</button></p>`
    :`<div class="empty">${ic('check','lg')}<div><b>Không có việc gì cần làm</b><p>${hid?'Các việc còn lại bạn đã để sau.':'Số liệu mới, không có hạn hay cảnh báo nào.'}</p></div></div>${foot}`,L.length?L.length+' việc':'');
}
// Mục tiêu tài sản ròng lớn nhất (2 tỷ) theo 3 kịch bản thu nhập; lãi tiết kiệm giữ nguyên mỗi tháng
function goalScenarios(C){
  const g=[...C.goals.list].filter(x=>x.due&&x.need>0).sort((a,b)=>b.need-a.need)[0];
  if(!g)return null;
  const today=serialOf(C.now), months=Math.max(1,Math.round((g.due-today)/30.44)), E=S.expense, it=C.interestMonthly;
  const side=CF.filter(m=>m.inc>0).slice(-3), sideAvg=side.length?sum(side,'inc2')/side.length:0;
  const sc=[['Như trung bình gần đây',INCOME-E,'var(--good)'],['Chỉ freelance + affiliate',sideAvg-E,'var(--caramel)'],['Không có thu nhập',-E,'var(--bad)']]
    .map(([n,save,col])=>{const step=save+it, pts=[];for(let m=0;m<=months;m++)pts.push(C.nw+step*m);
      const eta=step>0?Math.ceil(Math.max(0,g.need-C.nw)/step):null;return {n,save,step,col,pts,end:pts[months],eta};});
  const base=sc[0], eta=base.eta==null?null:mLab(C,base.eta);
  return {g,months,sc,need:g.need,needMonthly:(g.need-C.nw)/months-it,late:base.end<g.need,base,eta};
}
const mLab=(C,m)=>{const t=new Date(C.now+7*36e5);t.setUTCMonth(t.getUTCMonth()+m);return (t.getUTCMonth()+1)+'/'+t.getUTCFullYear();};
// Câu nói thẳng: theo mức dư hiện tại có kịp mục tiêu không, nếu không thì tới hạn đạt bao nhiêu, bao giờ đủ
function goalVerdict(R){
  if(!R)return '';
  if(!R.late)return R.base.eta?`Theo mức dư hiện tại: ${chip('kịp hạn','g')}, sau khoảng ${chip(R.base.eta+' tháng','b')}.`:'Đã đạt mục tiêu.';
  const x=R.base.save>0?R.needMonthly/R.base.save:null;
  const vt=tone4(R.base.end/R.need,1,.85,.6), et=R.base.eta!=null&&R.base.eta-R.months<=6?'o':R.base.eta!=null&&R.base.eta-R.months<=18?'r':'rr';
  return `Theo mức dư hiện tại: <b>không kịp</b>. Tới hạn đạt khoảng ${chip(tr(R.base.end),vt)} (${chip(pct(R.base.end/R.need,0),vt)} mục tiêu)${R.eta?', đủ '+tr(R.need)+' vào khoảng '+chip(R.eta,et):''}.${x&&x>=1.5?' Số cần để dành gấp khoảng '+nf(x,0)+' lần mức dư hiện tại.':''}`;
}
function vScenarios(C){
  const R=goalScenarios(C);
  if(!R)return '';
  const {g,months,sc}=R;
  return card(esc(g.name)+' · '+sdate(g.due),'flag',fanChart(C,R)+`<div class="tablewrap" style="margin-top:10px"><table><tr><th>Kịch bản</th><th>Dư/tháng</th><th>Tới hạn</th><th>Đạt mục tiêu</th></tr>
    ${sc.map(s=>`<tr><td><i class="tdot" style="background:${s.col}"></i> ${s.n}</td><td class="${cls(s.save)}">${trs(s.save)}</td><td class="${s.end>=g.need?'pos':'neg'}">${tr(s.end)}</td><td>${s.eta==null?'Không đạt':s.eta<=months?'Sau '+s.eta+' tháng':'Trễ '+(s.eta-months)+' tháng'}</td></tr>`).join('')}</table></div>
    <p class="note">${goalVerdict(R)}</p>
    <p class="note">Còn ${months} tháng. Để kịp hạn cần để dành khoảng <b>${tr(Math.max(0,R.needMonthly))}/tháng</b> (đã tính lãi tiết kiệm ${tr(C.interestMonthly)}/tháng). Không tính biến động giá cổ phiếu, khấu hao.</p>`,months+' tháng','sky');
}
// ---- Biểu đồ đợt 1 (Kai 12/11/2026, data analyst thích visualize): Sankey dòng tiền, vùng xếp chồng T1–T4, fan chart tới mục tiêu, Gantt sổ
const mlab=m=>{const t=new Date((m-25569)*DAY);return (t.getUTCMonth()+1)+'/'+String(t.getUTCFullYear()).slice(2);};
// Sankey: nguồn thu → Thu nhập → các khoản chi + để dành (vào ví tích lũy). Mặc định trung bình tối đa 3 tháng gần nhất ở Dòng tiền; nút chọn từng tháng
function sankeyData(){
  const ms=CF.filter(m=>m.inc>0||m.exp>0).sort((a,b)=>a.m-b.m);
  let pick=S.sk&&S.sk!=='avg'?ms.filter(m=>String(m.m)===S.sk):[];
  const one=pick.length>0;if(!one)pick=ms.slice(-3);
  if(!pick.length)return {ms,pick,one,inc1:INCOME,inc2:0,fixed:S.exp.fixed,personal:S.exp.personal,other:S.exp.other};
  const av=f=>sum(pick,f)/pick.length;
  return {ms,pick,one,inc1:av('inc1'),inc2:av('inc2'),fixed:av('fixed'),personal:av('personal'),other:av('other')};
}
function cfSankey(){
  const D=sankeyData(), inc=D.inc1+D.inc2, exp=D.fixed+D.personal+D.other, save=inc-exp, wal=esc(DATA.cfg.saveWallet||'Zalopay');
  if(inc<=0&&exp<=0)return '<p class="muted">Chưa có số liệu thu chi. Ghi ở sheet Dòng tiền.</p>';
  const left=[['Thu nhập chính',D.inc1,'var(--info)'],['Freelance, Shopee',D.inc2,'var(--info)'],['Thiếu, rút từ ví',-save,'var(--bad)']].filter(x=>x[1]>0);
  const right=[['Chi cố định',D.fixed,'var(--c1)'],['Chi cá nhân',D.personal,'var(--c2)'],['Chi khác',D.other,'var(--c4)'],['Để dành → '+wal,save,'var(--good)']].filter(x=>x[1]>0);
  const tot=Math.max(inc,exp), W=420,H=236,T=32,B=8,NW=9,G=22,x0=106,x1=198,x2=290;
  const k=(H-T-B-G*(Math.max(left.length,right.length)-1))/tot, mid=T+(H-T-B)/2;
  const stack=arr=>{const hs=arr.map(x=>Math.max(2,x[1]*k)), full=sum(hs,h=>h)+G*(arr.length-1);let y=mid-full/2;return arr.map((x,i)=>{const o={n:x[0],v:x[1],c:x[2],y,h:hs[i]};y+=hs[i]+G;return o;});};
  const A=stack(left), Z=stack(right), cY=mid-tot*k/2, share=v=>pct(v/(inc||1),0)+' thu nhập';
  const band=(xa,ya,xb,yb,h,c,tip)=>{const xm=((xa+xb)/2).toFixed(1);return `<path class="sk-l" d="M${xa},${ya.toFixed(1)}C${xm},${ya.toFixed(1)} ${xm},${yb.toFixed(1)} ${xb},${yb.toFixed(1)}L${xb},${(yb+h).toFixed(1)}C${xm},${(yb+h).toFixed(1)} ${xm},${(ya+h).toFixed(1)} ${xa},${(ya+h).toFixed(1)}Z" fill="${c}" data-tip="${tip}"/>`;};
  let oy=cY, links='';
  A.forEach(n=>{const h=n.v*k;links+=band(x0+NW,n.y,x1,oy,h,n.c,`${n.n}: ${tr2(n.v)} · ${share(n.v)}`);oy+=h;});
  oy=cY;Z.forEach(n=>{const h=n.v*k;links+=band(x1+NW,oy,x2,n.y,h,n.c,`${n.n}: ${tr2(n.v)} · ${share(n.v)}`);oy+=h;});
  const node=(x,n)=>`<rect x="${x}" y="${n.y.toFixed(1)}" width="${NW}" height="${n.h.toFixed(1)}" rx="2" fill="${n.c}"/>`;
  const lab=(x,n,anc)=>`<text x="${x}" y="${(n.y+n.h/2-2).toFixed(1)}" text-anchor="${anc}">${n.n}</text><text class="v" x="${x}" y="${(n.y+n.h/2+11).toFixed(1)}" text-anchor="${anc}">${tr(n.v)}</text>`;
  const sr=inc>0?save/inc:-1, tone=sr>=0.2?'good':sr>=0?'warn':'bad';
  const opts=[['avg',D.ms.length?'TB '+Math.min(3,D.ms.length)+' tháng':'Cấu hình'],...D.ms.slice(-6).map(m=>[String(m.m),mlab(m.m)])], cur=D.one?S.sk:'avg';
  return `<div class="rng">${opts.map(([k2,l])=>`<button data-sk="${k2}" aria-selected="${cur===k2}">${l}</button>`).join('')}</div>
  <svg class="chart sankey" viewBox="0 0 ${W} ${H}" role="img" aria-label="Sơ đồ dòng tiền: thu nhập đi vào các khoản chi và để dành">
    ${links}${A.map(n=>node(x0,n)).join('')}${Z.map(n=>node(x2,n)).join('')}
    <rect x="${x1}" y="${cY.toFixed(1)}" width="${NW}" height="${(tot*k).toFixed(1)}" rx="2" fill="var(--ink)" fill-opacity=".85"/>
    <text class="v" x="${x1+NW/2}" y="14" text-anchor="middle">Thu nhập ${tr(inc)}</text>
    ${A.map(n=>lab(x0-6,n,'end')).join('')}${Z.map(n=>lab(x2+NW+6,n,'start')).join('')}
  </svg>
  <div class="legend"><span class="chip ${tone}">${save>=0?'Để dành':'Thiếu'} ${tr(Math.abs(save))} · ${inc>0?pct(Math.abs(sr),0):'–'} thu nhập</span><span>Chi thiết yếu ${tr(D.fixed+D.personal)} · ${share(D.fixed+D.personal)}</span></div>
  <p class="note">${D.pick.length?(D.one?'Tháng '+mlab(D.pick[0].m):'Trung bình '+D.pick.length+' tháng gần nhất ('+mlab(D.pick[0].m)+(D.pick.length>1?'–'+mlab(D.pick[D.pick.length-1].m):'')+')')+' ở sheet Dòng tiền.':'Chưa có tháng nào ở sheet Dòng tiền, đang dùng số ở Cấu hình.'} Độ dày mỗi dải tỷ lệ với số tiền; chạm một dải để xem số.</p>`;
}
// Vùng xếp chồng T1–T4 theo ngày (sheet Lịch sử cột D–G) + hôm nay; nút đổi giữa giá trị và tỷ trọng %, nét đứt là ranh giới mục tiêu
function tierArea(C){
  const today=serialOf(C.now), mode=S.ta||'abs', ids=[1,2,3,4];
  const pts=HIST.filter(h=>h.d<today&&h.t&&sum(h.t,x=>x)>0).map(h=>({d:h.d,t:h.t.slice(0,4)}));
  pts.push({d:today,t:ids.map(id=>{const r=C.rows.find(x=>x.id===id);return r?r.value:0;})});
  const seg=`<div class="rng">${[['abs','Giá trị'],['pct','Tỷ trọng %']].map(([k,l])=>`<button data-ta="${k}" aria-selected="${mode===k}">${l}</button>`).join('')}</div>`;
  if(pts.length<2)return seg+`<div class="empty">${ic('calendar','lg')}<div><b>Đang chờ dữ liệu lịch sử</b><p>Sheet Lịch sử ghi giá trị từng tầng mỗi tối lúc 22 giờ. Biểu đồ hiện từ ngày thứ hai.</p></div></div>`;
  const W=360,H=190,L=8,R=58,T=12,B=24, d0=pts[0].d, d1=pts[pts.length-1].d;
  const rows=pts.map(p=>{const tot=sum(p.t,x=>x)||1, v=mode==='pct'?p.t.map(x=>x/tot):p.t;let c=0;return {d:p.d,raw:p.t,tot,cum:[0,...v.map(x=>c+=x)]};});
  const hi=mode==='pct'?1:Math.max(...rows.map(r=>r.cum[4]))*1.08;
  const x=d=>L+(d1===d0?1:(d-d0)/(d1-d0))*(W-L-R), y=v=>T+(1-v/hi)*(H-T-B);
  const area=i=>{const up=rows.map((r,j)=>`${j?'L':'M'}${x(r.d).toFixed(1)},${y(r.cum[i+1]).toFixed(1)}`).join(''), dn=[...rows].reverse().map(r=>`L${x(r.d).toFixed(1)},${y(r.cum[i]).toFixed(1)}`).join('');return `<path d="${up}${dn}Z" fill="${tcol(ids[i])}" fill-opacity=".72" stroke="${tcol(ids[i])}" stroke-width="1.2"/>`;};
  const last=rows[rows.length-1], ts=C.targetSum||100;let ct=0;
  const tgt=mode==='pct'?C.rows.filter(r=>r.id<4).map(r=>{ct+=r.target/ts;return `<line x1="${L}" x2="${W-R}" y1="${y(ct).toFixed(1)}" y2="${y(ct).toFixed(1)}" stroke="var(--ink)" stroke-dasharray="4 3" stroke-opacity=".75"/>`;}).join(''):'';
  // nhãn bên phải ở giữa dải của từng tầng, đẩy xuống nếu chồng nhau
  let prev=-99;const labs=ids.map((id,i)=>{let yy=y((last.cum[i]+last.cum[i+1])/2)+4;return {id,i,yy};}).reverse().map(o=>{if(o.yy<prev+12)o.yy=prev+12;prev=o.yy;return o;})
    .map(o=>`<text x="${W-R+8}" y="${o.yy.toFixed(1)}" fill="${tcol(o.id)}" style="fill:${tcol(o.id)};font-weight:600">T${o.id} ${mode==='pct'?pct(last.raw[o.i]/last.tot,0):trn(last.raw[o.i])+' Tr'}</text>`).join('');
  const dl=s=>{const t=new Date((s-25569)*DAY);return t.getUTCDate()+'/'+(t.getUTCMonth()+1);}, step=Math.max(1,Math.ceil(rows.length/60));
  return seg+`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Giá trị từng tầng theo thời gian">
    ${[0,1,2,3].map(area).join('')}${tgt}
    <line x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}" stroke="var(--line)"/>
    ${labs}
    <text x="${L}" y="${H-8}">${dl(d0)}</text><text x="${W-R}" y="${H-8}" text-anchor="end">Hôm nay</text>
    ${rows.filter((_,i)=>i%step===0||i===rows.length-1).map(r=>`<rect x="${(x(r.d)-6).toFixed(1)}" y="${T}" width="12" height="${H-T-B}" fill="transparent" data-tip="${dl(r.d)}: ${ids.map((id,i)=>'T'+id+' '+(mode==='pct'?pct(r.raw[i]/r.tot,0):tr(r.raw[i]))).join(' · ')}"/>`).join('')}
  </svg>
  <div class="legend">${C.rows.map(r=>`<span><i class="tdot" style="background:${tcol(r.id)}"></i>T${r.id} ${esc(r.name)}</span>`).join('')}${mode==='pct'?'<span>Nét đứt: ranh giới theo mục tiêu</span>':''}</div>
  <p class="note">${pts.length-1} ngày ở sheet Lịch sử + hôm nay. ${mode==='pct'?'Nét đứt là ranh giới mục tiêu giữa hai tầng (từ dưới lên T1|T2, T2|T3, T3|T4); mép màu thấp hơn nét đứt nghĩa là các tầng bên dưới đang thiếu so với mục tiêu.':'Chuyển sang Tỷ trọng % để so với mục tiêu.'}</p>`;
}
// Fan chart: đường giữa = kịch bản như trung bình gần đây; dải 68% và 95% theo độ lệch dư hằng tháng thật (sheet Dòng tiền, cần ≥ 3 tháng), giả định các tháng độc lập
function fanChart(C,R){
  const {g,months,sc}=R, base=R.base, surp=CF.filter(m=>m.inc>0||m.exp>0).map(m=>m.inc-m.exp), n=surp.length;
  const mean=n?sum(surp,v=>v)/n:0, real=n>=3, sd=real?Math.sqrt(sum(surp,v=>(v-mean)**2)/(n-1)):Math.max(Math.abs(base.save)*.35,2e6);
  const at=(m,z)=>C.nw+base.step*m+z*sd*Math.sqrt(m), hit=z=>{for(let m=0;m<=240;m++)if(at(m,z)>=g.need)return m;return null;};
  const eMid=hit(0), eLo=hit(-1), eHi=hit(1);
  const N=Math.min(120,Math.max(months,eMid!=null?Math.min(eMid+2,months*2):months));
  const W=360,H=200,L=8,Rt=70,T=14,B=26, ms=[...Array(N+1).keys()];
  const vals=[...ms.flatMap(m=>[at(m,-2),at(m,2)]),...sc.map(s=>C.nw+s.step*N),g.need,0], hi=Math.max(...vals)*1.04, lo=Math.min(...vals);
  const x=m=>L+m/N*(W-L-Rt), y=v=>T+(1-(v-lo)/(hi-lo))*(H-T-B);
  const poly=z=>ms.map(m=>`${m?'L':'M'}${x(m).toFixed(1)},${y(at(m,z)).toFixed(1)}`).join('')+[...ms].reverse().map(m=>`L${x(m).toFixed(1)},${y(at(m,-z)).toFixed(1)}`).join('')+'Z';
  const line=(f,col,dash,w)=>`<path d="${ms.map(m=>`${m?'L':'M'}${x(m).toFixed(1)},${y(f(m)).toFixed(1)}`).join('')}" fill="none" stroke="${col}" stroke-width="${w}"${dash?` stroke-dasharray="${dash}"`:''} stroke-linejoin="round"/>`;
  const dl=m=>{const t=new Date(C.now+7*36e5);t.setUTCMonth(t.getUTCMonth()+m);return (t.getUTCMonth()+1)+'/'+String(t.getUTCFullYear()).slice(2);};
  const tone=eMid!=null&&eMid<=months?'var(--good)':eMid!=null?'var(--warn)':'var(--bad)', stepTip=Math.max(1,Math.ceil(N/40));
  const svg=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Dự phóng dạng quạt tới mục tiêu">
    <path d="${poly(2)}" fill="var(--info)" fill-opacity=".16"/><path d="${poly(1)}" fill="var(--info)" fill-opacity=".32"/>
    ${lo<0?`<line x1="${L}" x2="${W-Rt+4}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)"/>`:''}
    <line x1="${L}" x2="${W-Rt+4}" y1="${y(g.need).toFixed(1)}" y2="${y(g.need).toFixed(1)}" stroke="var(--ink)" stroke-dasharray="4 4" stroke-opacity=".7"/>
    <text class="v" x="${W-Rt+8}" y="${(y(g.need)+4).toFixed(1)}">${trn(g.need)} Tr</text>
    ${N>months?`<line x1="${x(months).toFixed(1)}" x2="${x(months).toFixed(1)}" y1="${T}" y2="${H-B}" stroke="var(--ink)" stroke-opacity=".45" stroke-dasharray="2 3"/><text x="${x(months).toFixed(1)}" y="${T-3}" text-anchor="middle">hạn</text>`:''}
    ${sc.slice(1).map(s=>line(m=>C.nw+s.step*m,s.col,'5 4',1.6)).join('')}
    ${line(m=>at(m,0),tone,'',2.4)}
    ${eMid!=null&&eMid<=N?`<circle cx="${x(eMid).toFixed(1)}" cy="${y(g.need).toFixed(1)}" r="5" fill="${tone}" stroke="var(--surface)" stroke-width="2"/>`:''}
    <text x="${W-Rt+8}" y="${(y(at(N,0))+4).toFixed(1)}">${trn(at(N,0))} Tr</text>
    <text x="${L}" y="${H-8}">Hôm nay</text><text x="${x(N/2).toFixed(1)}" y="${H-8}" text-anchor="middle">${dl(Math.round(N/2))}</text><text x="${x(N).toFixed(1)}" y="${H-8}" text-anchor="end">${dl(N)}</text>
    ${ms.filter(m=>m%stepTip===0||m===N).map(m=>`<rect x="${(x(m)-5).toFixed(1)}" y="${T}" width="10" height="${H-T-B}" fill="transparent" data-tip="${dl(m)}: giữa ${tr(at(m,0))} · 68% trong ${tr(at(m,-1))}–${tr(at(m,1))}"/>`).join('')}
  </svg>`;
  const e=v=>v==null?'chưa tới trong 20 năm':mLab(C,v);
  return svg+`<div class="legend"><span><i class="tdot" style="background:${tone}"></i>Đường giữa: như trung bình gần đây</span><span><i class="tdot" style="background:var(--info);opacity:.5"></i>Dải đậm 68%, nhạt 95%</span>${sc.slice(1).map(s=>`<span><i class="tdot" style="background:${s.col}"></i>${s.n}</span>`).join('')}</div>
  <div class="kpis" style="margin-top:10px"><div class="kpi"><div class="label">Sớm (dải trên)</div><div class="v">${e(eHi)}</div></div><div class="kpi"><div class="label">Giữa</div><div class="v" style="color:${tone}">${e(eMid)}</div></div><div class="kpi"><div class="label">Muộn (dải dưới)</div><div class="v">${e(eLo)}</div></div></div>

// Gantt sổ tiết kiệm: mỗi sổ một thanh từ ngày gửi tới đáo hạn, phần đậm là đã qua; vạch hôm nay; sổ kế tiếp dự kiến (nét đứt) theo ví tích lũy
function savGantt(C,term){
  const now=C.now, a=C.acc, size=DATA.cfg.saveGoal||1e8, longd=DATA.cfg.longd;
  const rows=[...term].sort((p,q)=>p.sv.mat-q.sv.mat);
  let ghost=null;
  if(a&&(a.ready||a.months!=null)){const st=new Date(now);st.setUTCMonth(st.getUTCMonth()+(a.ready?0:a.months));const en=new Date(st);en.setUTCMonth(en.getUTCMonth()+12);ghost={s:+st,e:+en};}
  const t0=Math.min(now,...rows.map(r=>r.sv.start)), t1=Math.max(now,...rows.map(r=>r.sv.mat),ghost?ghost.e:0)+20*DAY;
  const P=t=>(t-t0)/(t1-t0)*100, X=t=>P(t).toFixed(2)+'%';
  const ticks=[];{const d=new Date(t0);d.setUTCDate(1);d.setUTCMonth(d.getUTCMonth()+1);for(;+d<t1;d.setUTCMonth(d.getUTCMonth()+1))if(d.getUTCMonth()%3===0&&Math.abs(P(+d)-P(now))>9)ticks.push(+d);}
  const tk=t=>{const d=new Date(t);return (d.getUTCMonth()+1)+'/'+String(d.getUTCFullYear()).slice(2);};
  const today=`<i class="gt-td" style="left:${X(now)}"></i>`;
  const bar=r=>{const col=r.sv.done?'var(--good)':r.daysLeft<=longd?'var(--c1)':'var(--c2)', el=r.sv.total?r.sv.el/r.sv.total*100:0;
    return `<div class="gt-r" data-tip="${esc(r.name)}: gửi ${fmtD(r.sv.start)}, đáo hạn ${fmtD(r.sv.mat)} · lãi ${tr2(r.sv.accrued)} / ${tr2(r.sv.full)}"><div class="gt-n">${logo(r).replace('class="logo"','class="logo sm"')}<b>${esc(r.name)}</b></div>
      <div class="gt-tr"><i class="gt-b" style="--gc:${col};left:${X(r.sv.start)};width:${(P(r.sv.mat)-P(r.sv.start)).toFixed(2)}%"><u style="width:${el.toFixed(1)}%"></u></i>${today}</div>
      <div class="gt-s num">${tr(r.principal)} · ${nf(r.rate,2)}% · lãi <b class="pos">+${tr(r.sv.accrued).replace(' Tr','')}</b>/${tr(r.sv.full)} · ${r.sv.done?'đã đáo hạn':'còn '+r.daysLeft+' ngày'}</div></div>`;};
  const gh=ghost?`<div class="gt-r" data-tip="Sổ kế tiếp dự kiến: khi ${esc(a.w.name)} đủ ${tr(size)}${a.eta?' (~'+a.eta+')':''}, kỳ hạn 12 tháng"><div class="gt-n"><span class="logo sm gt-q">#${rows.length+1}</span><b>Sổ kế tiếp</b></div>
      <div class="gt-tr"><i class="gt-b ghost" style="left:${X(ghost.s)};width:${(P(ghost.e)-P(ghost.s)).toFixed(2)}%"></i>${today}</div>
      <div class="gt-s">${a.ready?'Đủ tiền, mở ngay':'Dự kiến ~'+a.eta+' khi '+esc(a.w.name)+' đủ '+tr(size)} · còn thiếu ${tr(a.left)}</div></div>`:'';
  return `<div class="gt"><div class="gt-ax">${ticks.map(t=>`<span style="left:${X(t)}">${tk(t)}</span>`).join('')}<span class="now" style="left:${X(now)}">Hôm nay</span></div>${rows.map(bar).join('')}${gh}</div>
    <div class="legend"><span><i class="tdot" style="background:var(--c1)"></i>Đáo hạn trong ${longd} ngày (T1)</span><span><i class="tdot" style="background:var(--c2)"></i>Xa hơn (T2)</span><span>Phần đậm: thời gian đã qua${ghost?' · nét đứt: sổ dự kiến':''}</span></div>`;
}
// ---- Biểu đồ đợt 2 (Kai 12/11/2026): lịch nhiệt, drawdown, đường cạn tiền, thu chi đối xứng, bullet tầng, heatmap Kai Café
const dowOf=d=>((Math.floor(d)-25569)%7+7+3)%7;   // thứ Hai = 0 … Chủ nhật = 6
const DOW=['T2','T3','T4','T5','T6','T7','CN'];
// lưới ngày × tuần kiểu GitHub: items [{d,v}], col(v) trả màu, tip(it)
function heatGrid(items,col,tip,weeks,today){
  const by=new Map(items.map(x=>[Math.floor(x.d),x])), end=Math.floor(today), start=end-dowOf(end)-7*(weeks-1);
  const c=12,g=3,L=22,T=16, W=L+weeks*(c+g), H=T+7*(c+g);let cells='',mon='';
  for(let w=0;w<weeks;w++){const d0=start+w*7, t=new Date((d0-25569)*DAY);
    if(t.getUTCDate()<=7)mon+=`<text x="${L+w*(c+g)}" y="10">${t.getUTCMonth()+1}/${String(t.getUTCFullYear()).slice(2)}</text>`;
    for(let r=0;r<7;r++){const d=d0+r;if(d>end)continue;const it=by.get(d), f=it?col(it.v):null;
      cells+=`<rect x="${L+w*(c+g)}" y="${T+r*(c+g)}" width="${c}" height="${c}" rx="2.5" fill="${f||'rgba(255,255,255,.05)'}"${f?'':' stroke="rgba(170,190,225,.12)"'}${it?` data-tip="${tip(it)}"`:''}/>`;}}
  const rl=[0,2,4,6].map(r=>`<text x="0" y="${T+r*(c+g)+10}">${DOW[r]}</text>`).join('');
  return `<svg class="chart heat" viewBox="0 0 ${W} ${H}" role="img" aria-label="Lịch nhiệt theo ngày">${mon}${rl}${cells}</svg>`;
}
const mixC=(c,a)=>`color-mix(in srgb,${c} ${Math.round(a*100)}%,transparent)`;
// Lịch nhiệt: tài sản ròng tăng/giảm mỗi ngày (sheet Lịch sử). Tăng xanh lá đậm dần; giảm nhẹ cam, giảm ≥ 0,5% tài sản ròng đỏ; gần như không đổi xám
function nwHeat(C){
  const today=serialOf(C.now), pts=HIST.filter(h=>h.d<today).map(h=>({d:h.d,nw:h.nw}));pts.push({d:today,nw:C.nw});
  const ch=[];for(let i=1;i<pts.length;i++)ch.push({d:pts[i].d,v:pts[i].nw-pts[i-1].nw,p:(pts[i].nw-pts[i-1].nw)/(pts[i-1].nw||1),gap:pts[i].d-pts[i-1].d});
  if(ch.length<2)return `<div class="empty">${ic('calendar','lg')}<div><b>Đang chờ dữ liệu lịch sử</b><p>Mỗi ô là một ngày, cần sheet Lịch sử ghi ít nhất 3 ngày.</p></div></div>`;
  const mx=Math.max(...ch.map(x=>Math.abs(x.p)),0.001);
  const col=p=>Math.abs(p)<0.0005?'rgba(195,205,221,.35)':p>0?mixC('var(--good)',.3+.7*Math.min(1,p/mx)):p>-0.005?mixC('var(--warn)',.45+.55*Math.min(1,-p/0.005)):mixC('var(--bad)',.6+.4*Math.min(1,-p/mx));
  const dl=s=>{const t=new Date((s-25569)*DAY);return DOW[dowOf(s)]+' '+t.getUTCDate()+'/'+(t.getUTCMonth()+1);};
  const up=ch.filter(x=>x.p>=0.0005).length, dn=ch.filter(x=>x.p<=-0.0005).length, best=[...ch].sort((a,b)=>b.v-a.v)[0], worst=[...ch].sort((a,b)=>a.v-b.v)[0];
  const weeks=Math.min(26,Math.max(8,Math.ceil((today-ch[0].d)/7)+1));
  return heatGrid(ch.map(x=>({d:x.d,v:x.p,raw:x})),col,it=>`${dl(it.d)}: ${trs(it.raw.v)} (${pcts(it.raw.p,2)})${it.raw.gap>1?' · gộp '+it.raw.gap+' ngày':''}`,weeks,today)+
  `<div class="legend"><span><i class="tdot" style="background:var(--good)"></i>Tăng</span><span><i class="tdot" style="background:rgba(195,205,221,.35)"></i>Gần như không đổi</span><span><i class="tdot" style="background:var(--warn)"></i>Giảm nhẹ</span><span><i class="tdot" style="background:var(--bad)"></i>Giảm ≥ 0,5%</span></div>
  <div class="kpis" style="margin-top:10px"><div class="kpi"><div class="label">Ngày tăng / giảm</div><div class="v"><span class="pos">${up}</span> / <span class="neg">${dn}</span></div><div class="s">trong ${ch.length} lần ghi</div></div>
    <div class="kpi"><div class="label">Ngày tốt nhất</div><div class="v pos">${trs(best.v)}</div><div class="s">${dl(best.d)}</div></div>
    <div class="kpi"><div class="label">Ngày tệ nhất</div><div class="v ${cls(worst.v)}">${trs(worst.v)}</div><div class="s">${dl(worst.d)}</div></div></div>
  <p class="note">Mỗi ô là thay đổi tài sản ròng so với lần ghi trước (gồm cả tiền để dành thêm và giá cổ phiếu). Ô trống là ngày chưa ghi.</p>`;
}
// Drawdown: tài sản ròng thấp hơn đỉnh trước đó bao nhiêu %, sụt sâu nhất và đã hồi chưa
function drawdown(C){
  const today=serialOf(C.now), pts=HIST.filter(h=>h.d<today).map(h=>({d:h.d,v:h.nw}));pts.push({d:today,v:C.nw});
  if(pts.length<3)return `<div class="empty">${ic('calendar','lg')}<div><b>Đang chờ dữ liệu lịch sử</b><p>Cần ít nhất 3 ngày ở sheet Lịch sử.</p></div></div>`;
  let pk=-Infinity,pkD=0;const dd=pts.map(p=>{if(p.v>pk){pk=p.v;pkD=p.d;}return {d:p.d,v:p.v,pk,pkD,x:pk>0?p.v/pk-1:0};});
  const worst=dd.reduce((a,b)=>b.x<a.x?b:a,dd[0]), cur=dd[dd.length-1];
  const rec=worst.x<0?dd.find(p=>p.d>worst.d&&p.v>=worst.pk):null;
  const lo=Math.min(-0.01,worst.x*1.2), W=360,H=150,L=8,R=46,T=10,B=24, d0=dd[0].d, d1=cur.d;
  const x=d=>L+(d1===d0?1:(d-d0)/(d1-d0))*(W-L-R), y=v=>T+(v/lo)*(H-T-B);
  const tone=v=>v>-0.0005?'var(--info)':v>-0.05?'var(--warn)':'var(--bad)';
  const path=dd.map((p,i)=>`${i?'L':'M'}${x(p.d).toFixed(1)},${y(p.x).toFixed(1)}`).join('');
  const dl=s=>{const t=new Date((s-25569)*DAY);return t.getUTCDate()+'/'+(t.getUTCMonth()+1);}, step=Math.max(1,Math.ceil(dd.length/60));
  const ticks=[lo/2,lo].map(v=>`<line x1="${L}" x2="${W-R+4}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="var(--line)" stroke-dasharray="2 4"/><text x="${W-R+8}" y="${(y(v)+4).toFixed(1)}">${pcts(v,1)}</text>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Mức sụt so với đỉnh">${ticks}
    <line x1="${L}" x2="${W-R+4}" y1="${T}" y2="${T}" stroke="var(--ink)" stroke-opacity=".5"/><text x="${W-R+8}" y="${T+4}">Đỉnh</text>
    <path d="${path}L${x(d1).toFixed(1)},${T}L${x(d0).toFixed(1)},${T}Z" fill="${tone(worst.x)}" fill-opacity=".25"/>
    <path d="${path}" fill="none" stroke="${tone(worst.x)}" stroke-width="2" stroke-linejoin="round"/>
    ${worst.x<0?`<circle cx="${x(worst.d).toFixed(1)}" cy="${y(worst.x).toFixed(1)}" r="4.5" fill="${tone(worst.x)}" stroke="var(--surface)" stroke-width="2"/>`:''}
    <text x="${L}" y="${H-8}">${dl(d0)}</text><text x="${x(d1).toFixed(1)}" y="${H-8}" text-anchor="end">Hôm nay</text>
    ${dd.filter((_,i)=>i%step===0||i===dd.length-1).map(p=>`<rect x="${(x(p.d)-6).toFixed(1)}" y="${T}" width="12" height="${H-T-B}" fill="transparent" data-tip="${dl(p.d)}: ${tr(p.v)} · ${p.x<-0.00005?pcts(p.x,2)+' so với đỉnh '+dl(p.pkD):'đang ở đỉnh'}"/>`).join('')}
  </svg>
  <div class="kpis" style="margin-top:10px"><div class="kpi"><div class="label">Sụt sâu nhất</div><div class="v" style="color:${tone(worst.x)}">${worst.x<0?pcts(worst.x,1):'0%'}</div><div class="s">${worst.x<0?trs(worst.v-worst.pk)+' · '+dl(worst.d):'chưa sụt lần nào'}</div></div>
    <div class="kpi"><div class="label">Hiện tại</div><div class="v" style="color:${tone(cur.x)}">${cur.x<-0.00005?pcts(cur.x,1):'Ở đỉnh'}</div><div class="s">${cur.x<-0.00005?'đỉnh '+tr(cur.pk)+' ngày '+dl(cur.pkD):'cao nhất từ trước tới nay'}</div></div>
    <div class="kpi"><div class="label">Hồi phục</div><div class="v">${worst.x>=0?'–':rec?(rec.d-worst.d)+' ngày':'Chưa'}</div><div class="s">${worst.x>=0?'':rec?'từ đáy về lại đỉnh':'chưa về lại đỉnh '+tr(worst.pk)}</div></div></div>
  <p class="note">Drawdown = tài sản ròng so với mức cao nhất trước đó. Màu: xám là ở đỉnh, cam là sụt dưới 5%, đỏ là sụt từ 5% trở lên.</p>`;
}
// Đường cạn tiền: nếu từ hôm nay không có thu nhập, thanh khoản 3 lớp giảm mỗi tháng bằng chi thiết yếu (dùng ngay → rút sổ → bán cổ phiếu)
function runwayCurve(C){
  const E=C.essential||1, tm=C.targetM, N=Math.min(60,Math.max(tm+2,Math.ceil(C.runway)+2)), keys=['now','soon','market'];
  const st=[], out={};let r={now:C.L.now,soon:C.L.soon,market:C.L.market}, zero=null;
  for(let m=0;m<=N;m++){st.push({...r});if(m===N)break;let need=E;
    for(const k of keys){const t=Math.min(r[k],need);r[k]-=t;need-=t;if(r[k]<=0.5&&out[k]==null&&C.L[k]>0)out[k]=m+1;}
    if(zero==null&&need>0.5)zero=m+1-need/E;}
  const W=360,H=180,L=8,R=58,T=14,B=26, hi=C.L.total*1.05||1;
  const x=m=>L+m/N*(W-L-R), y=v=>T+(1-v/hi)*(H-T-B);
  const cum=s=>[0,s.now,s.now+s.soon,s.now+s.soon+s.market];
  const area=i=>{const top=st.map((s,m)=>`${m?'L':'M'}${x(m).toFixed(1)},${y(cum(s)[i+1]).toFixed(1)}`).join(''), bot=st.map((s,m)=>m).reverse().map(m=>`L${x(m).toFixed(1)},${y(cum(st[m])[i]).toFixed(1)}`).join('');return `<path d="${top}${bot}Z" fill="${LAYERS[i][2]}" fill-opacity=".55" stroke="${LAYERS[i][2]}" stroke-width="1"/>`;};
  const ok=zero==null||zero>=tm, tk=[...Array(N+1).keys()].filter(m=>m%(N>30?6:3)===0);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Thanh khoản còn lại nếu mất thu nhập">
    ${[0,1,2].map(area).join('')}
    <line x1="${L}" x2="${W-R+4}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)"/>
    <line x1="${x(tm).toFixed(1)}" x2="${x(tm).toFixed(1)}" y1="${T}" y2="${H-B}" stroke="var(--ink)" stroke-dasharray="4 3" stroke-opacity=".7"/><text x="${(x(tm)-4).toFixed(1)}" y="${T+8}" text-anchor="end">mục tiêu ${tm} th</text>
    ${zero!=null?`<circle cx="${x(zero).toFixed(1)}" cy="${y(0).toFixed(1)}" r="5" fill="${ok?'var(--warn)':'var(--bad)'}" stroke="var(--surface)" stroke-width="2"/><text class="v" x="${x(zero).toFixed(1)}" y="${(y(0)-9).toFixed(1)}" text-anchor="middle">hết sau ${nf(zero,1)} th</text>`:''}
    <text x="${W-R+8}" y="${(y(C.L.total)+4).toFixed(1)}">${trn(C.L.total)} Tr</text>
    ${tk.map(m=>`<text x="${x(m).toFixed(1)}" y="${H-8}" text-anchor="middle">${m}</text>`).join('')}
    ${st.map((s,m)=>`<rect x="${(x(m)-5).toFixed(1)}" y="${T}" width="10" height="${H-T-B}" fill="transparent" data-tip="Tháng ${m}: còn ${tr(s.now+s.soon+s.market)} (dùng ngay ${tr(s.now)}, sổ ${tr(s.soon)}, cổ phiếu ${tr(s.market)})"/>`).join('')}
  </svg>
  <div class="legend">${LAYERS.map(l=>C.L[l[0]]>0?`<span><i class="tdot" style="background:${l[2]}"></i>${l[1]}${out[l[0]]?' · hết tháng '+out[l[0]]:''}</span>`:'').join('')}<span>Trục ngang: số tháng không có thu nhập</span></div>
  <p class="note">Mỗi tháng tiêu ${tr2(E)} chi thiết yếu, lấy lần lượt ví và tiền mặt → rút sổ (chỉ tiền gốc) → bán cổ phiếu (× hệ số ${nf(DATA.cfg.haircut,1)}). ${ok?'Đủ qua mục tiêu '+tm+' tháng.':'<b class="neg">Không đủ mục tiêu '+tm+' tháng.</b>'} Chưa tính lãi và các khoản chờ nhận.</p>`;
}
// Thu chi theo tháng dạng đối xứng: thu lên (xanh lá), chi xuống (xám), đường tỷ lệ để dành (trục phải), chấm tô theo 20% / 0%
function cfChart(){
  const ms=CF.filter(m=>m.inc>0||m.exp>0).slice(-12);
  if(!ms.length)return '';
  const W=360,H=200,L=4,R=40,T=12,B=24, mx=Math.max(1,...ms.flatMap(m=>[m.inc,m.exp])), slot=(W-L-R)/ms.length, bw=Math.min(16,slot*.55), mid=T+(H-T-B)/2;
  const y=v=>mid-v/mx*((H-T-B)/2), sr=m=>m.inc>0?(m.inc-m.exp)/m.inc:null, tone=v=>v==null||v<0?'var(--bad)':v<0.2?'var(--warn)':'var(--good)';

  const cx=i=>L+slot*(i+.5), line=ms.map((m,i)=>sr(m)==null?'':`${i&&sr(ms[i-1])!=null?'L':'M'}${cx(i).toFixed(1)},${yr(sr(m)).toFixed(1)}`).join('');
  return `<div class="label" style="margin:16px 0 6px">Theo tháng (sheet Dòng tiền)</div><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Thu chi theo tháng">
    <line x1="${L}" x2="${W-R}" y1="${mid}" y2="${mid}" stroke="var(--line)"/>
    <line x1="${L}" x2="${W-R}" y1="${yr(0.2).toFixed(1)}" y2="${yr(0.2).toFixed(1)}" stroke="var(--good)" stroke-opacity=".5" stroke-dasharray="2 4"/><text x="${W-R+4}" y="${(yr(0.2)+4).toFixed(1)}" style="fill:var(--good)">20%</text>
    <text x="${W-R+4}" y="${(yr(0)+4).toFixed(1)}">0%</text>
    ${ms.map((m,i)=>`<g data-tip="${mlab(m.m)}: thu ${tr2(m.inc)} (chính ${tr2(m.inc1)}, khác ${tr2(m.inc2)}), chi ${tr2(m.exp)}, dư ${trs(m.inc-m.exp)}${m.inc?' · để dành '+pct(sr(m),0):''}">

// Kai Café: doanh thu theo thứ × tuần (heatmap) + trung bình từng thứ
function kaiHeat(k){

  const last=Math.max(...ds.map(x=>x.d)), mx=Math.max(...ds.map(x=>x.rev)), mn=Math.min(...ds.map(x=>x.rev)), weeks=Math.min(16,Math.ceil((last-Math.min(...ds.map(x=>x.d)))/7)+1);
  const by=DOW.map((_,i)=>{const r=ds.filter(x=>dowOf(x.d)===i&&x.d>last-weeks*7);return r.length?sum(r,'rev')/r.length:0;}), bmx=Math.max(...by)||1;
  const best=by.indexOf(Math.max(...by)), pos=by.filter(v=>v>0), wk=by.indexOf(Math.min(...pos));
  const kv=v=>PRIV?HIDE:nf(v/1e3,0)+'k', dl=s=>{const t=new Date((s-25569)*DAY);return DOW[dowOf(s)]+' '+t.getUTCDate()+'/'+(t.getUTCMonth()+1);};

// Dòng thời gian 12 tháng: sổ đáo hạn, hạn nợ, hạn mục tiêu, ngày ví tích lũy dự kiến đủ để mở sổ
const TL={sav:['var(--c2)','Sổ đáo hạn'],in:['var(--good)','Thu nợ'],out:['var(--bad)','Trả nợ'],goal:['var(--accent)','Mục tiêu'],acc:['var(--c1)','Mở sổ mới']};
function timeline(C){

// Thanh so với trần Kai đặt (cổ phiếu + crypto, cho vay, Kai Café): vạch đậm là trần, vượt thì đỏ
function capBar(label,v,cap,shown,tip,note){

// Ô tỷ lệ (treemap, chia ô vuông dần): mỗi ô một tài sản, diện tích theo giá trị, màu theo tầng
function squarify(items,W,H){
  const out=[], tot=sum(items,'v')||1;let x=0,y=0,w=W,h=H, rest=items.map(i=>({...i,ar:i.v/tot*W*H}));
  const worst=(row,s)=>{const sm=sum(row,'ar'),mx=Math.max(...row.map(r=>r.ar)),mn=Math.min(...row.map(r=>r.ar));return Math.max(s*s*mx/(sm*sm),sm*sm/(s*s*mn));};
  while(rest.length){
    const s=Math.min(w,h);let row=[rest[0]],best=worst(row,s),i=1;
    while(i<rest.length){const t=[...row,rest[i]],wv=worst(t,s);if(wv<=best){row=t;best=wv;i++;}else break;}
    const th=sum(row,'ar')/s;let off=0;
    for(const r of row){const len=r.ar/th;out.push(w>=h?{...r,x,y:y+off,w:th,h:len}:{...r,x:x+off,y,w:len,h:th});off+=len;}
    if(w>=h){x+=th;w-=th;}else{y+=th;h-=th;}
    rest=rest.slice(row.length);
  }
  return out;
}

  const W=160,H=110, tot=sum(items,'v')||1, cells=squarify(items,W,H);
  const segs=C.rows.map(r=>({v:r.value,col:tcol(r.id),label:'T'+r.id+' '+r.name}));
  if(C.outside.length)segs.push({v:sum(C.outside,'value'),col:'var(--c0)',label:'Ngoài tháp'});
  return `<div class="tm" role="img" aria-label="Cơ cấu tài sản, mỗi ô một tài sản">${cells.map(c=>{const big=c.w/W>.2&&c.h/H>.22, mid=c.w/W>.13&&c.h/H>.2;
    return `<div class="tm-c" style="left:${c.x/W*100}%;top:${c.y/H*100}%;width:${c.w/W*100}%;height:${c.h/H*100}%;--tc:${c.col}" data-tip="${esc(c.a.name)}: ${tr(c.v)} · ${pct(c.v/tot,1)} · ${esc(tierName(c.a.tier))}">
      ${mid?`<div class="tm-in">${big&&c.a.brand?logo(c.a):''}<b>${esc(c.a.name)}</b><span class="num">${tr(c.v)} · ${pct(c.v/tot,0)}</span></div>`:''}</div>`;}).join('')}</div>

const mRate=R=>Math.pow(1+R,1/12)-1;
// Số tháng để P chạm T với góp m mỗi tháng, lãi kép năm R (tháng r = (1+R)^(1/12) − 1):
// FV(n) = P(1+r)^n + m((1+r)^n − 1)/r  ⇒  n = ln((T·r + m)/(P·r + m)) / ln(1+r). Không lãi: n = (T − P)/m. Không tới được: null.
function monthsTo(P,T,m,R){
  if(P>=T)return 0;
  const r=mRate(R);
  if(r<=0)return m>0?Math.ceil((T-P)/m):null;
  const num=T*r+m, den=P*r+m;
  if(den<=0||num<=0)return null;
  const n=Math.log(num/den)/Math.log(1+r);
  return isFinite(n)&&n>=0?Math.ceil(n):null;
}
// Tính ngược: cần góp bao nhiêu mỗi tháng để P thành T sau n tháng. m = (T − P·g)·r / (g − 1), g = (1+r)^n
function needMonthly(P,T,n,R){
  if(n<=0)return null;
  const r=mRate(R);
  if(r<=0)return (T-P)/n;
  const g=Math.pow(1+r,n);
  return (T-P*g)*r/(g-1);
}

const LUONG=37.5, OZ=31.1035;   // 1 lượng = 37,5 g = 10 chỉ; 1 ounce = 31,1035 g
const mkSer=(c,days)=>{const L=MK.filter(r=>typeof r.v[c]==='number'&&r.v[c]>0);if(!L.length)return [];const end=L[L.length-1].d;return L.filter(r=>days==null||r.d>=end-days).map(r=>({d:r.d,v:r.v[c]}));};

function mkChg(c,days){
  const s=mkSer(c);if(s.length<2)return null;const L=s[s.length-1];

// ---- Vàng 24K (Kai 12/11/2026: rất quan tâm nhẫn Kim Gia Bảo của Bảo Tín Mạnh Hải và vàng 24K Huy Thanh). Cột sheet Thị trường: G/H = KGB mua/bán, K/L = Huy Thanh mua/bán (đ/chỉ)
const GSHOP=[{k:'kgb',n:'Kim Gia Bảo 24K',b:'Bảo Tín Mạnh Hải',buy:6,sell:7,col:'var(--c2)'},{k:'ht',n:'Huy Thanh 24K',b:'Huy Thanh',buy:10,sell:11,col:'var(--c1)'}];
// vàng đang có ở sheet Tài sản: loại Vàng, tên (hoặc cột Mã) có "Kim Gia Bảo"/"Bảo Tín"/"BTMH"/"KGB" hoặc "Huy Thanh"/"HT"; cột Số lượng = số chỉ
function goldShopOf(a){const t=(a.name||'')+' '+(a.sym||'');return /kim gia bảo|bảo tín|btmh|\bkgb\b/i.test(t)?GSHOP[0]:/huy thanh|\bht\b/i.test(t)?GSHOP[1]:null;}
// giá mới nhất một cột (khai báo hàm để gọi được cả khi MK chưa nạp)
function goldLast(c){try{for(let i=MK.length-1;i>=0;i--){const v=MK[i].v[c];if(typeof v==='number'&&v>0)return {d:MK[i].d,v};}}catch(_){}return null;}
// thế giới quy đổi đồng/chỉ theo ngày: USD/oz × USD chuyển khoản VCB ÷ 31,1035 × 3,75
const worldChi=r=>{const x=r.v[15],u=r.v[14]||r.v[13];return x>0&&u>0?x*u/OZ*LUONG/10:null;};
function goldRows(days){const all=MK.filter(r=>GSHOP.some(s=>r.v[s.sell]>0));if(!all.length)return [];const end=all[all.length-1].d;return all.filter(r=>days==='all'||r.d>=end-(+days));}
function goldChart(){
  const gr=FM.gr||'90', R=goldRows(gr), rng=`<div class="rng">${[['30','30N'],['90','90N'],['365','1N'],['all','Tất cả']].map(([k,l])=>`<button data-gr="${k}" aria-selected="${gr===k}">${l}</button>`).join('')}</div>`;
  if(R.length<2){const T=mkTrend();
    return rng+`<div class="empty">${ic('calendar','lg')}<div><b>Đang tích lũy giá từng ngày</b><p>Sheet Thị trường mới ghi giá vàng 24K từ ${R.length?sdate(R[0].d):'hôm nay'}; biểu đồ hiện từ ngày thứ hai.</p></div></div>`+
      (T?`<div class="label" style="margin:12px 0 6px">Diễn biến Kim Gia Bảo theo Bảo Tín Mạnh Hải</div><div class="dbars">${[['d1','Hôm nay'],['d30','30 ngày'],['m6','6 tháng'],['y1','1 năm'],['y5','5 năm']].filter(([k])=>T[k]!=null).map(([k,l])=>`<div class="kh-r"><span style="width:auto">${l}</span><i><u style="width:${Math.min(100,Math.abs(T[k])/Math.max(...Object.values(T).map(Math.abs))*100).toFixed(1)}%;background:${T[k]>=0?'var(--good)':'var(--bad)'}"></u></i><b class="num ${clsR(T[k])}">${pctS(T[k]/100)}</b></div>`).join('')}</div>`:'');}
  const W=360,H=210,L=8,Rt=64,T=12,B=24, d0=R[0].d, d1=R[R.length-1].d;
  const vals=R.flatMap(r=>[...GSHOP.flatMap(s=>[r.v[s.buy],r.v[s.sell]]),worldChi(r)]).filter(v=>v>0), lo=Math.min(...vals), hi=Math.max(...vals), pad=(hi-lo)*.1||hi*.01;
  const x=d=>L+(d1===d0?1:(d-d0)/(d1-d0))*(W-L-Rt), y=v=>T+(1-(v-lo+pad)/(hi-lo+2*pad))*(H-T-B);
  const ser=c=>R.filter(r=>r.v[c]>0);
  const line=(c,col,dash,w)=>{const s=ser(c);return s.length?`<path d="${s.map((r,i)=>`${i?'L':'M'}${x(r.d).toFixed(1)},${y(r.v[c]).toFixed(1)}`).join('')}" fill="none" stroke="${col}" stroke-width="${w}"${dash?` stroke-dasharray="${dash}"`:''} stroke-linejoin="round"/>`:'';};
  const band=s=>{const r=R.filter(q=>q.v[s.buy]>0&&q.v[s.sell]>0);if(r.length<2)return '';return `<path d="${r.map((q,i)=>`${i?'L':'M'}${x(q.d).toFixed(1)},${y(q.v[s.sell]).toFixed(1)}`).join('')}${[...r].reverse().map(q=>`L${x(q.d).toFixed(1)},${y(q.v[s.buy]).toFixed(1)}`).join('')}Z" fill="${s.col}" fill-opacity=".16"/>`;};
  const wr=R.filter(r=>worldChi(r)), wl=wr.length>1?`<path d="${wr.map((r,i)=>`${i?'L':'M'}${x(r.d).toFixed(1)},${y(worldChi(r)).toFixed(1)}`).join('')}" fill="none" stroke="var(--info)" stroke-width="1.4" stroke-dasharray="3 3"/>`:'';
  let prev=-99;const labs=GSHOP.map(s=>{const l=ser(s.sell).pop();return l?{s,yy:y(l.v[s.sell])+4,v:l.v[s.sell]}:null;}).filter(Boolean).sort((a,b)=>a.yy-b.yy).map(o=>{if(o.yy<prev+13)o.yy=prev+13;prev=o.yy;return o;})
    .map(o=>`<text x="${W-Rt+6}" y="${o.yy.toFixed(1)}" style="fill:${o.s.col};font-weight:600">${nf(o.v/1e6,2)} Tr</text>`).join('');
  const ticks=[lo,(lo+hi)/2,hi].map(v=>`<line x1="${L}" x2="${W-Rt+2}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="var(--line)" stroke-dasharray="2 4"/>`).join('');
  const dl=s=>{const t=new Date((s-25569)*DAY);return t.getUTCDate()+'/'+(t.getUTCMonth()+1);}, step=Math.max(1,Math.ceil(R.length/60));
  const tip=r=>dl(r.d)+': '+GSHOP.filter(s=>r.v[s.sell]>0).map(s=>`${s.k==='kgb'?'KGB':'HT'} bán ${nf(r.v[s.sell]/1e6,2)} mua ${nf(r.v[s.buy]/1e6,2)}`).join(' · ')+(worldChi(r)?` · thế giới ${nf(worldChi(r)/1e6,2)}`:'')+' (Tr/chỉ)';
  return rng+`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Giá vàng 24K hai cửa hàng theo ngày">${ticks}
    ${GSHOP.map(band).join('')}${wl}${GSHOP.map(s=>line(s.buy,s.col,'2 3',1.2)+line(s.sell,s.col,'',2.2)).join('')}${labs}
    <text x="${L}" y="${H-8}">${dl(d0)}</text><text x="${W-Rt}" y="${H-8}" text-anchor="end">${dl(d1)}</text>
    ${R.filter((_,i)=>i%step===0||i===R.length-1).map(r=>`<rect x="${(x(r.d)-6).toFixed(1)}" y="${T}" width="12" height="${H-T-B}" fill="transparent" data-tip="${tip(r)}"/>`).join('')}
  </svg>
  <div class="legend">${GSHOP.map(s=>`<span><i class="tdot" style="background:${s.col}"></i>${s.n} (${s.b})</span>`).join('')}<span><i class="tdot" style="background:var(--info)"></i>Thế giới quy đổi</span><span>Nét liền: giá bán ra (bạn mua) · nét đứt: giá mua vào (bạn bán) · dải màu: chênh mua – bán</span></div>`;
}
// % cao hơn thế giới theo ngày cho từng nhà (giá bán ra so với thế giới quy đổi)
function goldPremium(){

// Mua ở đâu, bán ở đâu: mua theo giá bán ra của nhà A, bán lại theo giá mua vào của nhà B

function rulesCheck(C){
  const cfg=DATA.cfg, goal=cfg.saveGoal||100000000, today=serialOf(C.now), a=C.acc, out=[];
  const prev=n=>{let b=null;for(const h of HIST)if(h.d<today&&h.a&&h.a[n]!=null&&(!b||h.d>b.d))b=h;return b?b.a[n]:null;};
  const so=C.inNW.filter(x=>x.kind==='savings'), giam=so.filter(x=>{const p=prev(x.name);return p!=null&&x.value<p-1e5;});
  out.push(['01','Không động vào gốc sổ tiết kiệm',giam.length?['bad','Vi phạm']:['good','Đạt'],giam.length?'Giảm: '+giam.map(x=>esc(x.name)).join(', '):'Gốc '+so.length+' sổ không giảm so với lần chụp trước']);
  if(a){
    let over=0;if(a.have>goal){over=1;for(const h of [...HIST].sort((x,y)=>y.d-x.d)){if(h.a&&h.a[a.w.name]>goal)over=today-h.d;else break;}}
    out.push(['03',esc(a.w.name)+' chỉ là chỗ đỗ tiền, không quá '+tr(goal)+' lâu',a.have<=goal?['good','Đạt']:over>30?['bad','Vi phạm']:['warn','Cần chú ý'],tr(a.have)+(a.have>goal?' · vượt khoảng '+over+' ngày':' / '+tr(goal))]);
    out.push(['04','Chạm '+tr(goal)+' thì mở sổ ngay',a.ready?['warn','Đến lúc mở sổ']:['good','Chưa tới'],a.ready?'Đủ tiền, mở sổ trong tuần này':'Còn thiếu '+tr(a.left)]);
  }
  const big=so.filter(x=>x.principal>goal*1.1);
  out.push(['05','Nhiều sổ khoảng '+tr(goal)+' thay vì một sổ lớn',big.length?['warn','Cần chú ý']:['good','Đạt'],big.length?'Sổ lớn: '+big.map(x=>esc(x.name)+' '+tr(x.principal)).join(', '):so.length+' sổ, sổ lớn nhất '+(so.length?tr(Math.max(...so.map(x=>x.principal))):'–')]);
  const r3=C.rows.find(r=>r.id===3), r4=C.rows.find(r=>r.id===4), risk=(r3?r3.share:0)+(r4?r4.share:0), lim=((r3?r3.target:0)+(r4?r4.target:0))/100;
  out.push(['06','Ổn định hơn tăng trưởng, không FOMO',risk<=lim+0.05?['good','Đạt']:['warn','Cần chú ý'],'T3 + T4 đang '+pct(risk,0)+', mục tiêu '+pct(lim,0)]);
  out.push(['07','Cổ phiếu + crypto không quá '+pct(cfg.riskCap,0)+' tài sản ròng',C.riskShare<=cfg.riskCap?['good','Đạt']:['warn','Vượt trần'],'Đang '+pct(C.riskShare,1)+' · '+tr(C.risky)]);
  out.push(['08','Cho vay tổng không quá '+tr(cfg.lendCap),C.recV<=cfg.lendCap?['good','Đạt']:['warn','Vượt trần'],'Đang cho vay '+tr(C.recV)]);
  if(C.kaiA)out.push(['09','Góp vào Kai Café không quá '+tr(cfg.kaiCap),C.kaiPut<=cfg.kaiCap?['good','Đạt']:['warn','Vượt trần'],'Đã góp '+tr(C.kaiPut)+' · phần của bạn còn '+tr(C.kaiVal)]);
  return out;
}

const seenVer=()=>{try{return +localStorage.getItem(SEEN_KEY)||0;}catch(_){return APP_VER;}};
function sheetBody(t){
  if(t==='new')return CHANGES.map(([v,d,items],i)=>`<div class="cl${i?'':' cur'}"><div class="cl-h"><span class="cl-v">v${v}</span><span class="muted">${d}</span>${i?'':'<span class="chip good">Bản đang dùng</span>'}</div>
    <ul>${items.map(x=>'<li>'+x+'</li>').join('')}</ul></div>`).join('');
  return GUIDE.map(([h,icon,sub,steps])=>`<div class="gd"><div class="gd-h"><span class="ii">${ic(icon,'sm')}</span><b>${h}</b>${sub?'<span class="muted">'+sub+'</span>':''}</div>
    <ol class="plan">${steps.map(([a,b])=>'<li><div><b>'+a+'</b><span>'+b+'</span></div></li>').join('')}</ol></div>`).join('');
}
function openSheet(t){
  const el=document.getElementById('sheet');if(!el)return;
  el.querySelectorAll('[data-sh]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.sh===t)));
  const body=document.getElementById('shBody');body.innerHTML=sheetBody(t);body.scrollTop=0;
  if(el.hidden){el.hidden=false;el.classList.remove('closing');document.documentElement.style.overflow='hidden';}
  try{localStorage.setItem(SEEN_KEY,String(APP_VER));}catch(_){}
  const nb=document.getElementById('news');if(nb)nb.classList.remove('dot');
}
function closeSheet(){
  const el=document.getElementById('sheet');if(!el||el.hidden)return;
  const done=()=>{el.hidden=true;el.classList.remove('closing');document.documentElement.style.overflow='';};
  if(MOTION()){el.classList.add('closing');setTimeout(done,200);}else done();
}

    const rot=window.innerWidth<window.innerHeight&&window.innerWidth<700&&ar>=1.8&&!c.classList.contains('pyr3');
    const w=rot?Math.min(bh,bw*ar):Math.min(bw,bh*ar);
    c.setAttribute('style','display:block;margin:0;max-width:none;width:'+w+'px;height:'+(w/ar)+'px');
    const wrap=document.createElement('div');wrap.className='zm-svg'+(rot?' rot':'');wrap.appendChild(c);body.appendChild(wrap);
  }else{if(c.classList.contains('tablewrap'))body.classList.add('zm-table');body.appendChild(c);}
}
function closeZoom(){
  const z=document.getElementById('zoom');if(!z||z.hidden)return;
  const done=()=>{z.hidden=true;z.classList.remove('closing');z.querySelector('.zm-body').innerHTML='';if(document.getElementById('sheet').hidden)document.documentElement.style.overflow='';};
  if(MOTION()){z.classList.add('closing');setTimeout(done,180);}else done();
}
// trả về true nếu cú chạm đã được xử lý bởi phần phóng to
function zoomClick(e){
  const z=document.getElementById('zoom');
  if(z&&!z.hidden){if(e.target.closest('.zm-x')||!e.target.closest('.zm-body > *'))closeZoom();return true;}
  const el=e.target.closest&&e.target.closest(ZOOMABLE);
  if(!el||!el.closest('#view')||e.target.closest(NOZOOM)||el.closest('#zoom'))return false;
  openZoom(el);return true;
}
// ---- chuyển động: ô sáng trượt theo tab, nội dung trượt vào theo hướng tab
const MOTION=()=>!!(window.matchMedia&&!matchMedia('(prefers-reduced-motion: reduce)').matches);
function movePill(){
  const n=document.getElementById('tabs'),p=n&&n.querySelector('.pill'),b=n&&n.querySelector('[aria-selected="true"]');if(!p||!b||!b.offsetWidth)return;
  p.style.width=b.offsetWidth+'px';p.style.height=b.offsetHeight+'px';p.style.transform='translate('+b.offsetLeft+'px,'+b.offsetTop+'px)';
  if(!p.classList.contains('on'))requestAnimationFrame(()=>p.classList.add('on'));
}
let animT=0;
function animateView(k){
  if(!MOTION())return;const v=document.getElementById('view');
  v.classList.remove('in-r','in-l','in-up');void v.offsetWidth;v.classList.add(k);
  clearTimeout(animT);animT=setTimeout(()=>v.classList.remove(k),700);   // bỏ lớp để lần vẽ lại (làm mới 60 giây) không chạy lại hiệu ứng
}
function go(tab){
  const ix=t=>TABS.findIndex(x=>x[0]===t), dir=ix(tab)>=ix(S.tab)?'in-r':'in-l', same=tab===S.tab;
  S.tab=tab;render();window.scrollTo(0,0);if(!same)animateView(dir);try{history.replaceState(null,'','#'+tab);}catch(_){}
}
window.addEventListener('resize',movePill);
try{document.fonts&&document.fonts.ready.then(movePill);}catch(_){}
window.addEventListener('scroll',()=>{const a=document.querySelector('.appbar');if(a)a.classList.toggle('sc',window.scrollY>4);},{passive:true});
// chiều cao thanh trên để ghim thanh tab ngay bên dưới (máy tính)
const setAbh=()=>{const a=document.querySelector('.appbar');if(a)document.documentElement.style.setProperty('--abh',a.offsetHeight+'px');};
setAbh();window.addEventListener('resize',setAbh,{passive:true});if(document.fonts&&document.fonts.ready)document.fonts.ready.then(setAbh);
// màn mở app: tự biến mất sau ~0,9 giây, rồi các thẻ hiện lên
setTimeout(()=>{const sp=document.getElementById('splash');if(sp)sp.remove();animateView('in-up');if(seenVer()!==APP_VER)openSheet('new');},MOTION()?2000:0);
document.addEventListener('click',e=>{
  if(zoomClick(e))return;
  const fs=e.target.closest('[data-fsub]');if(fs){FM.sub=fs.dataset.fsub;saveFM();render();window.scrollTo(0,0);animateView('in-up');return;}
  const mb=e.target.closest('[data-msbase]');if(mb){FM.base=mb.dataset.msbase;saveFM();const y=window.scrollY;render();window.scrollTo(0,y);return;}
  if(e.target.closest('#news')){openSheet('new');return;}
  const sh=e.target.closest('[data-sh]');if(sh){openSheet(sh.dataset.sh);return;}
  if(e.target.closest('[data-close]')){closeSheet();return;}
  const skb=e.target.closest('[data-sk]');if(skb){S.sk=skb.dataset.sk;const y=window.scrollY;render();window.scrollTo(0,y);return;}
  const tab2=e.target.closest('[data-ta]');if(tab2){S.ta=tab2.dataset.ta;const y=window.scrollY;render();window.scrollTo(0,y);return;}
  const grb=e.target.closest('[data-gr]');if(grb){FM.gr=grb.dataset.gr;saveFM();const y=window.scrollY;render();window.scrollTo(0,y);return;}
  const hb=e.target.closest('[data-hr]');if(hb){S.hr=hb.dataset.hr;const y=window.scrollY;render();window.scrollTo(0,y);return;}
  const tb=e.target.closest('[data-tab]');if(tb){go(tb.dataset.tab);return;}
  if(e.target.closest('#privacy')){PRIV=!PRIV;try{localStorage.setItem(PRIV_KEY,PRIV?'1':'0');}catch(_){}render();return;}
  const gt=e.target.closest('[data-goto]');if(gt){if(gt.classList.contains('hgoal')){FM.sub='road';saveFM();}go(gt.dataset.goto);return;}
  const sz=e.target.closest('[data-snooze]');if(sz){snooze(decodeURIComponent(sz.dataset.snooze),+sz.dataset.days||30);const y=window.scrollY, it=sz.closest('.todo-i'), done=()=>{render();window.scrollTo(0,y);};
    if(it&&MOTION()){it.classList.add('out');setTimeout(done,180);}else done();return;}
  const fb=e.target.closest('[data-filter]');if(fb){S.filter=fb.dataset.filter;render();return;}
  const tt=e.target.closest('[data-tier]');if(tt){const t=+tt.dataset.tier;
    if(tt.closest('svg.glass')&&!tt.classList.contains('on')){S.selTier=t;const y=window.scrollY;render();window.scrollTo(0,y);return;}
    S.filter=tt.dataset.tier;go('assets');return;}
  if(e.target.closest('[data-signin]')){signIn();return;}
  if(e.target.closest('[data-signout]')){signOut();return;}
  if(e.target.closest('#install')){if(installEvt){installEvt.prompt();installEvt.userChoice.finally(()=>{installEvt=null;render();});}return;}
  if(e.target.closest('#refresh')){
    if(IS_WEB){if(authOk())loadSheet(true);else{LIVE.state='login';render();}}
    else if(mcp)loadSheet(true);
    else{LIVE.state='err';LIVE.msg='Mở trang này trong claude.ai để nối Google Sheet';render();}
    return;}
});
document.addEventListener('submit',e=>{
  if(e.target.id!=='pwform')return;
  e.preventDefault();
  const v=(document.getElementById('pw')||{}).value||'';
  if(!v.trim())return;
  PW=v.trim();try{localStorage.setItem(PW_KEY,PW);}catch(_){}
  loadSheet(true);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeZoom();closeSheet();}
  if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('layer')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));}
});
// ô nhập của tab Tự do: cập nhật FM, lưu trên máy, chỉ vẽ lại phần dự báo (giữ con trỏ ở ô đang gõ)
function fmInput(e){
  const id=e.target.id, num=()=>parseFloat(String(e.target.value).replace(',','.'));
  if(id==='mkAmt'){const v=num();if(v>0){FM.mkAmt=v;saveFM();const el=document.getElementById('mkCalc');if(el)el.innerHTML=mkCalc();}return true;}
  if(!/^fm(Save|Ret|Inf|Real|Tgt|Date)$/.test(id))return false;
  const v=num();
  if(id==='fmSave'&&v>=0)FM.m=v*1e6; else if(id==='fmRet'&&v>=0)FM.R=v/100; else if(id==='fmInf'&&v>=0)FM.inf=v/100;
  else if(id==='fmReal')FM.real=e.target.checked; else if(id==='fmTgt')FM.tgt=+e.target.value; else if(id==='fmDate'&&e.target.value)FM.date=e.target.value;
  saveFM();
  if(LASTC){const d=document.getElementById('fmDyn'),r=document.getElementById('fmRev');if(d)d.innerHTML=msDyn(LASTC);if(r)r.innerHTML=msRev(LASTC);}
  return true;
}
document.addEventListener('change',e=>{fmInput(e);});
document.addEventListener('input',e=>{
  const id=e.target.id;
  if(fmInput(e))return;
  if(id==='sim'||id==='gap'){
    if(id==='sim')S.sim=(+e.target.value)*1e6;else S.gap=+e.target.value;
    const y=window.scrollY;render();const el=document.getElementById(id);if(el)el.focus();window.scrollTo(0,y);}
});
// tooltip dùng chung cho mọi phần tử có data-tip
const tip=document.getElementById('tip');
document.addEventListener('pointermove',e=>{
  const t=e.target.closest&&e.target.closest('[data-tip]');
  if(!t||!tip){if(tip)tip.hidden=true;return;}
  tip.textContent=t.getAttribute('data-tip');tip.hidden=false;
  const w=tip.offsetWidth,h=tip.offsetHeight;
  tip.style.left=Math.max(8,Math.min(window.innerWidth-w-8,e.clientX+14))+'px';
  tip.style.top=Math.max(8,e.clientY-h-12)+'px';
});
document.addEventListener('pointerleave',()=>{if(tip)tip.hidden=true;});
document.addEventListener('scroll',()=>{if(tip)tip.hidden=true;},{passive:true});
// kéo xuống ở đầu trang để làm mới
let ptrY=null;const ptr=document.getElementById('ptr');
document.addEventListener('touchstart',e=>{ptrY=window.scrollY<=0&&e.touches.length===1?e.touches[0].clientY:null;},{passive:true});
document.addEventListener('touchmove',e=>{if(ptrY==null||!ptr)return;const dy=e.touches[0].clientY-ptrY;if(dy<=8){ptr.hidden=true;return;}
  ptr.hidden=false;ptr.style.transform='translateY('+Math.min(dy,110)*0.5+'px)';ptr.classList.toggle('ready',dy>80);ptr.lastChild.textContent=dy>80?'Thả để làm mới':'Kéo để làm mới';},{passive:true});
document.addEventListener('touchend',()=>{if(ptrY==null||!ptr)return;const go=ptr.classList.contains('ready');ptr.hidden=true;ptr.style.transform='';ptr.classList.remove('ready');ptrY=null;
  if(go){const rb=document.getElementById('refresh');if(rb)rb.click();}});
// tự đọc lại mỗi phút khi đang mở; app chạy nền thì không đọc, mở lại (ví dụ từ màn hình chính) thì đọc ngay nếu số đã cũ hơn 1 phút
const canLoad=()=>mcp||(IS_WEB&&(gTok||PW));
setInterval(()=>{if(document.hidden)return;const a=document.activeElement;if(a&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName))return;if(canLoad())loadSheet(false);else render();},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&canLoad()&&Date.now()-LIVE.at>60000)loadSheet(false);});
render();
</script>
<script>
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
