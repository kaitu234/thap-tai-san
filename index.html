<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3A2719">
<meta name="description" content="Sổ tài sản cá nhân đọc từ Google Sheet: tháp 4 tầng, phân tích sức khỏe tài chính.">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>:root{--nav-lift:64px;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Tháp Tài Sản</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
/* Layout: app di động theo hệ nhận diện Kai Café (KaiDashboard): nền be, chữ nâu, thẻ trắng viền mảnh bo 8px,
   bảng có dòng tiêu đề nâu, số liệu chữ hẹp. Tăng = xanh (--good), giảm = đỏ (--bad); màu tầng không dùng xanh lá/đỏ để khỏi lẫn. */
:root{
  --bg:#F6EFE3; --surface:#FFFFFF; --surface2:#F6EFE3; --ink:#5E3B25; --muted:#8A6B55; --line:#E2D2BA;
  --accent:#5E3B25; --accent-ink:#FFFFFF; --accent-soft:#EBDCC3; --caramel:#B7793A;
  --hero:#4A2E1C; --hero2:#6E4A30; --hero-ink:#FFFFFF; --hero-mute:#EBDCC3;
  --good:#2F7A4B; --warn:#9A6A10; --bad:#B23A2E; --info:#2A6FB8;
  --good-soft:#DDEFE2; --warn-soft:#F6E8C7; --bad-soft:#F7DEDA; --info-soft:#DCEAF8;
  --up-hero:#BFE8CB; --dn-hero:#FFC2B8;
  /* màu tầng (đã chạy validate_palette dataviz trên nền #FFFFFF / #241911) */
  --c1:#2a78d6; --c2:#B7793A; --c3:#7B4FA8; --c4:#e87ba4; --c0:#B9A58F;
  --b-tcb:#E0262E; --b-seab:#E5531A; --b-zalo:#0A68FE; --b-bhxh:#1D5FA8; --b-stock:#2a78d6; --b-biz:#5E3B25; --b-gear:#5B6B7A; --b-loan:#8A5A9E;
  --shadow:0 1px 2px rgba(94,59,37,.05),0 6px 18px rgba(94,59,37,.06);
  --on-brand:#FFFFFF;
  --h1:#3987e5; --h2:#D49B5C; --h3:#A27AE0; --h4:#d55181;
  --b-bank:#5E3B25; --b-momo:#A50064; --b-vcb:#0B7A3E; --b-bidv:#1A5CA8; --b-vpb:#0E8A4F; --b-mb:#1E3A8A; --b-acb:#1F4FA0;
  --b-tpb:#5B2C83; --b-vib:#0F5AA6; --b-agri:#A3262E; --b-ctg:#0A58A8; --b-spay:#EE4D2D; --b-vtp:#D61F2C;
  --f-disp:'Barlow Condensed','Arial Narrow','Be Vietnam Pro',sans-serif;
  --f-body:'Be Vietnam Pro','Segoe UI',system-ui,-apple-system,sans-serif;
  --r:8px; --nav-h:64px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17100B; --surface:#241911; --surface2:#2C2016; --ink:#F2E6D5; --muted:#B39E89; --line:#3D2E22;
    --accent:#E3C39A; --accent-ink:#241911; --accent-soft:#3A2B1E; --caramel:#D49B5C;
    --hero:#0F0A06; --hero2:#2C2016; --hero-ink:#F2E6D5; --hero-mute:#B39E89;
    --good:#7DCB98; --warn:#E3B95B; --bad:#F08A7C; --info:#8DB8E8;
    --good-soft:#17301F; --warn-soft:#3A2E14; --bad-soft:#3B1F1A; --info-soft:#1C2A3A;
    --up-hero:#7DCB98; --dn-hero:#F08A7C;
    --c1:#3987e5; --c2:#B07A3C; --c3:#A27AE0; --c4:#d55181; --c0:#6F5D4D;
    --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --bg:#17100B; --surface:#241911; --surface2:#2C2016; --ink:#F2E6D5; --muted:#B39E89; --line:#3D2E22;
    --accent:#E3C39A; --accent-ink:#241911; --accent-soft:#3A2B1E; --caramel:#D49B5C;
    --hero:#0F0A06; --hero2:#2C2016; --hero-ink:#F2E6D5; --hero-mute:#B39E89;
    --good:#7DCB98; --warn:#E3B95B; --bad:#F08A7C; --info:#8DB8E8;
    --good-soft:#17301F; --warn-soft:#3A2E14; --bad-soft:#3B1F1A; --info-soft:#1C2A3A;
    --up-hero:#7DCB98; --dn-hero:#F08A7C;
    --c1:#3987e5; --c2:#B07A3C; --c3:#A27AE0; --c4:#d55181; --c0:#6F5D4D;
    --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 14px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
.wrap{max-width:1080px;margin:0 auto}
h1,h2,h3{margin:0;text-wrap:balance}
.num,.tab-num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.pos{color:var(--good)} .neg{color:var(--bad)} .warn{color:var(--warn)}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:16px;height:16px} svg.i.lg{width:24px;height:24px}

/* app bar */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);display:flex;align-items:center;gap:12px;padding:12px 0 10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brand .mark{width:38px;height:38px;border-radius:11px;background:var(--hero);display:grid;place-items:center;flex:none}
.brand h1{font:800 26px/1 var(--f-disp);letter-spacing:.02em;text-transform:uppercase;white-space:nowrap}
.brand h1 span{color:var(--accent)}
.brand small{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;cursor:pointer;flex:none;text-decoration:none}
.iconbtn:hover{background:var(--surface2)}
.iconbtn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* tabs: top on wide screens, bottom bar on phones */
nav.tabs{display:flex;gap:6px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin:4px 0 0;overflow-x:auto}
nav.tabs button{appearance:none;border:0;background:none;color:var(--muted);font:600 13.5px var(--f-body);padding:9px 14px;border-radius:10px;cursor:pointer;display:flex;align-items:center;gap:7px;white-space:nowrap;flex:1;justify-content:center}
nav.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
@media (max-width:760px){
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:35;margin:0;border-radius:18px 18px 0 0;border-width:1px 0 0;gap:0;
    padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));
    box-shadow:var(--shadow);overflow:visible}
  nav.tabs button{flex-direction:column;gap:3px;font-size:10.5px;padding:7px 2px;min-width:0}
  nav.tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
  /* bản website: huy hiệu Netlify chiếm góc dưới phải, nên thanh tab nổi lên phía trên nó */
  html.lift nav.tabs{bottom:calc(var(--nav-lift) + env(safe-area-inset-bottom,0px));left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));
    border-radius:18px;border-width:1px;padding:6px 8px}
  html.lift body{padding-bottom:calc(var(--nav-h) + 28px + var(--nav-lift) + env(safe-area-inset-bottom,0px))}
}
@media (min-width:761px){body{padding-bottom:40px}}
/* điện thoại hẹp: tiêu đề nhỏ lại, nút gọn, ẩn nút mở sheet (đã có ở tab Tài sản) */
@media (max-width:480px){
  .appbar{gap:6px}
  .brand{gap:8px}
  .brand .mark{width:34px;height:34px;border-radius:9px}
  .brand h1{font-size:20px;overflow:hidden;text-overflow:ellipsis}
  .brand .status{flex-wrap:nowrap;gap:6px;min-width:0}
  .iconbtn{width:36px;height:36px;border-radius:10px}
  #opensheet{display:none}
}
@media (max-width:760px){
  .filters{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-4px;padding:0 4px 2px}
  .filters::-webkit-scrollbar{display:none}
  .fbtn{flex:none}
  .card{padding:14px}
  .kpi .v{font-size:21px}
}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

main{padding-top:16px;display:grid;gap:16px}
.status{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.dotlive{width:8px;height:8px;border-radius:50%;background:var(--c0)}
.dotlive.ok{background:var(--good)} .dotlive.bad{background:var(--bad)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.card-h h2{font:700 18px/1.15 var(--f-disp);letter-spacing:.04em;text-transform:uppercase;flex:1;min-width:0;color:var(--ink)}
.card-h .ico{width:30px;height:30px;border-radius:6px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.card-h .ico svg.i{width:17px;height:17px}
.card-h .aside{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.label{font:600 11.5px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.big{font:700 clamp(36px,10vw,52px)/1 var(--f-disp);letter-spacing:.01em;font-variant-numeric:tabular-nums}
.mid{font:700 26px/1.1 var(--f-disp);letter-spacing:.01em;font-variant-numeric:tabular-nums}
.note{font-size:12.5px;color:var(--muted);margin:10px 0 0}

/* hero */
.hero{background:linear-gradient(135deg,var(--hero) 0%,var(--hero2) 100%);color:var(--hero-ink);border-radius:10px;padding:20px;
  display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px 24px;position:relative;overflow:hidden;min-width:0;box-shadow:var(--shadow)}
.hero .label{color:var(--hero-mute)}
.hero .l{display:grid;gap:16px;align-content:center;min-width:0}
.chip-chg{display:inline-flex;align-items:center;gap:6px;font:700 13px var(--f-body);padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.12);width:fit-content}
.chip-chg.up,.hero .up{color:var(--up-hero)} .chip-chg.dn,.hero .dn{color:var(--dn-hero)}
.hero .stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.hero .stat{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:8px;padding:10px 12px;min-width:0}
.hero .stat .v{font:700 22px/1.15 var(--f-disp);font-variant-numeric:tabular-nums}
.hero .stat .s{font-size:11.5px;color:var(--hero-mute)}
.hero svg.hp{width:100%;max-width:400px;height:auto;display:block;margin:0 auto}
.hp text{font-family:var(--f-disp)}
.hp .tn{font:700 15px var(--f-disp);letter-spacing:.04em;fill:var(--hero-ink);text-transform:uppercase}
.hp .tv{font:500 11.5px var(--f-body);fill:var(--hero-mute)}
.hp .gl{font:800 15px var(--f-disp);fill:var(--hero)}
.layer{cursor:pointer}

/* logos & lists */
.logo{--lc:var(--accent);width:42px;height:42px;border-radius:9px;background:var(--lc);color:var(--on-brand);display:grid;place-items:center;flex:none;
  font:800 13px/1 var(--f-disp);letter-spacing:.02em;position:relative;overflow:hidden}
.logo::after{content:"";position:absolute;inset:0;background:linear-gradient(140deg,rgba(255,255,255,.28),rgba(255,255,255,0) 55%)}
.logo svg.i{width:22px;height:22px;stroke:var(--on-brand)}
.alist{display:grid;gap:2px}
.arow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;padding:10px 6px;border-radius:12px}
.arow+.arow{border-top:1px dashed var(--line)}
.arow:hover{background:var(--surface2)}
.arow .nm{font-weight:600;line-height:1.25}
.arow .sb{font-size:12px;color:var(--muted);line-height:1.3;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.arow .rt{text-align:right}
.arow .val{font:700 18px/1.1 var(--f-disp);font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.chip{display:inline-flex;align-items:center;gap:4px;font:600 11px var(--f-body);padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.chip.good,.chip.up{background:var(--good-soft);color:var(--good)} .chip.dn{background:var(--bad-soft);color:var(--bad)} .chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.info{background:var(--info-soft);color:var(--info)}
.tdot{width:9px;height:9px;border-radius:3px;display:inline-block;flex:none}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.fbtn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 12.5px var(--f-body);padding:6px 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.fbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* charts */
svg.chart{width:100%;height:auto;display:block;overflow:visible}
svg.chart text{font-family:var(--f-body);fill:var(--muted);font-size:11px}
svg.chart text.v{fill:var(--ink);font-weight:600}
svg.chart text.h{fill:var(--ink);font:700 14px var(--f-disp);letter-spacing:.03em;text-transform:uppercase}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
#tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--bg);font:500 12px/1.35 var(--f-body);padding:7px 10px;border-radius:9px;max-width:240px;box-shadow:var(--shadow)}
.bar{height:8px;border-radius:999px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--accent)}
.bar.rk{position:relative;overflow:visible}
.bar.rk>em{position:absolute;top:-4px;bottom:-4px;width:3px;margin-left:-1.5px;border-radius:2px;background:var(--ink)}
.chk{display:grid;gap:4px;margin-top:12px;padding:10px 12px;border-radius:10px;border-left:4px solid var(--good);background:var(--surface2);font-size:13px;line-height:1.45}
.chk.bad{border-left-color:var(--bad)}
.chk>b{display:flex;gap:6px;align-items:center;color:var(--ink)}
.chk.ok>b .i{color:var(--good)}.chk.bad>b .i{color:var(--bad)}

.logo.img{background:var(--on-brand);box-shadow:inset 0 0 0 1px var(--line)}
.logo.img::after{display:none}
.logo.img svg{width:100%;height:100%;display:block}
.logo.sm{width:28px;height:28px;border-radius:8px;font-size:10px}
.logo.sm svg.i{width:16px;height:16px}
.abars{display:grid;gap:14px}
.ab-h{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-bottom:6px}
.ab-h span:first-child{display:inline-flex;align-items:center;gap:8px;font-weight:600}
.ab-t{position:relative;height:12px;background:var(--surface2);border-radius:6px}
.ab-t i{display:block;height:100%;border-radius:6px;min-width:3px}
.ab-t em{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:var(--ink);border-radius:1px}
.donutwrap{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
@media (max-width:420px){.donutwrap{grid-template-columns:1fr;justify-items:center}.donutwrap .dlist{width:100%}}
.dlist{display:grid;gap:8px}
.drow{display:grid;grid-template-columns:auto minmax(0,1fr) auto 40px;gap:8px;align-items:center;font-size:13px}
.drow span:last-child{text-align:right}
.stack{display:flex;gap:2px;height:22px;border-radius:8px;overflow:hidden;background:var(--surface2)}
.stack i{display:block;height:100%}
.gauge{padding:8px 0 4px}
.g-t{position:relative;height:14px;background:var(--surface2);border-radius:7px}
.g-t .zone{position:absolute;top:0;bottom:0;background:var(--good-soft);border-left:2px solid var(--good);border-right:2px solid var(--good)}
.g-t i{position:absolute;left:0;top:4px;bottom:4px;background:var(--accent);border-radius:4px}
.g-t b{position:absolute;top:-5px;width:4px;height:24px;margin-left:-2px;background:var(--ink);border-radius:2px}
.g-l{position:relative;height:20px;font-size:11px;color:var(--muted);margin-top:6px}
.g-l span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.g-l span:first-child{transform:none}
.dbars{display:grid;gap:10px}
.db{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.4fr) auto;gap:10px;align-items:center;font-size:13px}
.db-l{display:inline-flex;align-items:center;gap:7px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.db-t{position:relative;height:14px;background:linear-gradient(var(--line),var(--line)) center/1px 100% no-repeat}
.db-t i{position:absolute;top:1px;bottom:1px;border-radius:4px;min-width:2px}
.db-v{min-width:64px;text-align:right;font-weight:600}
.pwform{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.pwform input{flex:1;min-width:0;font:500 15px var(--f-body);padding:10px 12px;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.todo{display:grid;gap:8px}
.todo-i{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 12px;border:1px solid var(--line);border-left:4px solid var(--line);border-radius:8px;background:var(--surface)}
.todo-i.bad{border-left-color:var(--bad)} .todo-i.warn{border-left-color:var(--warn)} .todo-i.info{border-left-color:var(--info)}
.todo-i .ii{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;background:var(--surface2);color:var(--ink)}
.todo-i.bad .ii{background:var(--bad-soft);color:var(--bad)} .todo-i.warn .ii{background:var(--warn-soft);color:var(--warn)} .todo-i.info .ii{background:var(--info-soft);color:var(--info)}
.todo-i b{display:block;font-weight:600;font-size:13.5px;line-height:1.3}
.todo-i span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.snz{margin-top:6px;appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:600 11.5px var(--f-body);padding:3px 8px;border-radius:6px;cursor:pointer;white-space:nowrap}
.snz:hover{color:var(--ink);background:var(--surface2)}
.linkbtn{appearance:none;border:0;background:none;padding:0;color:var(--accent);font:inherit;font-weight:600;text-decoration:underline;cursor:pointer}
details.more{margin-top:8px} details.more summary{cursor:pointer;font-size:12.5px;font-weight:600;color:var(--accent);padding:4px 0} details.more .todo{margin-top:8px}
/* tiến độ mục tiêu trên thẻ đầu */
.hgoal{display:grid;gap:6px;padding:10px 12px;border-radius:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);cursor:pointer}
.hg-h{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--hero-mute)} .hg-h b{font:700 16px var(--f-disp);color:var(--hero-ink)}
.hg-t{height:8px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden} .hg-t i{display:block;height:100%;border-radius:99px;background:var(--up-hero)}
.hg-s{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:11.5px;color:var(--hero-mute)} .hg-s span{min-width:0}
.spark{width:96px;height:28px;flex:none;opacity:.9}
/* thác nước 30 ngày */
.wf{display:grid;gap:6px}
.wf-r{display:grid;grid-template-columns:minmax(0,9.5em) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:12.5px}
.wf-l{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .wf-l small{display:block;color:var(--muted);font-size:11px}
.wf-r.end .wf-l{font-weight:700} .wf-r b{font-size:12.5px;text-align:right;min-width:4.6em}
.wf-t{position:relative;height:16px;background:repeating-linear-gradient(90deg,transparent 0 24px,var(--line) 24px 25px)}
.wf-t i{position:absolute;top:2px;bottom:2px;border-radius:3px} .wf-t i.up{background:var(--good)} .wf-t i.dn{background:var(--bad)}
.wf-t em{position:absolute;top:-1px;bottom:-1px;width:3px;margin-left:-1.5px;border-radius:2px;background:var(--ink)}
/* dòng thời gian */
.tl{display:grid;gap:6px;margin-top:10px}
.tl-i{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:4px 8px;align-items:center;font-size:12.5px;padding:6px 0;border-top:1px solid var(--line)}
.tl-d{color:var(--muted);font-size:12px} .tl-t{min-width:0} .tl-v{text-align:right;font-weight:600}
.tl-i .chip{grid-column:3/5;justify-self:start}
@media (min-width:560px){.tl-i{grid-template-columns:auto 5.5em minmax(0,1fr) auto auto}.tl-i .chip{grid-column:auto}}
/* thước giá cổ phiếu */
.pg-wrap+.pg-wrap{margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.pg-h{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center}
.pg-h .nm{font:700 18px var(--f-disp);letter-spacing:.03em} .pg-h .sb{font-size:12.5px;color:var(--muted)}
.pg{margin:18px 4px 6px}
.pg-t{position:relative;height:10px;border-radius:99px;background:var(--surface2);border:1px solid var(--line)}
.pg-t i{position:absolute;top:0;bottom:0;border-radius:99px;opacity:.85} .pg-t i.up{background:var(--good)} .pg-t i.dn{background:var(--bad)}
.pg-t em{position:absolute;top:-6px;bottom:-6px;width:2px;margin-left:-1px;background:var(--ink)} .pg-t em.sell{background:var(--good);width:3px}
.pg-t b{position:absolute;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:var(--c3);border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.pg-l{position:relative;height:18px;margin-top:8px;font-size:11.5px;color:var(--muted)}
.pg-l span{position:absolute;transform:translateX(-50%);white-space:nowrap} .pg-l span.sell{color:var(--good);font-weight:600}
.pg-now{position:relative;height:16px;margin-bottom:6px;font:700 12px var(--f-body);color:var(--c3)} .pg-now span{position:absolute;transform:translateX(-50%);white-space:nowrap}
/* ô tỷ lệ */
.tm{position:relative;width:100%;aspect-ratio:16/11;border-radius:8px;overflow:hidden}
.tm-c{position:absolute;box-sizing:border-box;border:2px solid var(--surface);background:color-mix(in srgb,var(--tc) 30%,var(--surface));border-top:4px solid var(--tc);border-radius:6px;overflow:hidden}
.tm-in{padding:6px 7px;display:grid;gap:2px;align-content:start;font-size:11.5px;line-height:1.25}
.tm-in b,.tm-in span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .tm-in b{font-weight:700} .tm-in span{color:var(--ink);opacity:.8}
.tm-in .logo{width:26px;height:26px;margin-bottom:2px}
/* bậc thang sổ */
.ladder{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:8px;align-items:end}
.lad-c{display:grid;grid-template-rows:130px auto auto auto;gap:2px;text-align:center;min-width:0;font-size:11.5px}
.lad-b{position:relative;display:flex;align-items:flex-end;justify-content:center;border:1.5px dashed var(--line);border-radius:6px;overflow:hidden;align-self:end}
.lad-b i{position:absolute;left:0;right:0;bottom:0;border-radius:0 0 4px 4px}
.lad-b b{position:relative;font:700 14px var(--f-disp);padding:4px 0;color:var(--ink)}
.lad-b.full{border-style:solid;border-color:var(--c2)}
.lad-b.full b{color:var(--surface)}
.lad-c.next .lad-b{border-color:var(--c1)}
.lad-lg{position:absolute;top:6px;left:50%;transform:translateX(-50%)} .lad-lg .logo{width:24px;height:24px}
.lad-t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:4px} .lad-s{color:var(--muted);font-size:10.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* tháp: chữ lệch mục tiêu */
svg .dv{font:700 12.5px var(--f-body);fill:var(--muted)} svg .dv.pos{fill:var(--good)} svg .dv.neg{fill:var(--bad)}
/* kéo để làm mới, khung chờ */
html{overscroll-behavior-y:contain}
#ptr{position:fixed;z-index:40;top:calc(env(safe-area-inset-top,0px) + 6px);left:0;right:0;margin:0 auto;width:fit-content;display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);font-size:12.5px;color:var(--muted)}
#ptr[hidden]{display:none}
#ptr.ready{color:var(--accent);border-color:var(--accent)} #ptr.ready svg{transform:rotate(180deg)} #ptr svg{transition:transform .2s}
.sk{border-radius:10px;background:linear-gradient(90deg,var(--surface2) 25%,var(--line) 50%,var(--surface2) 75%);background-size:200% 100%;animation:sk 1.3s ease-in-out infinite}
@keyframes sk{from{background-position:200% 0}to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:8px}
.slot{display:grid;gap:2px;padding:10px 12px;border-radius:12px;border:1px dashed var(--line);font-size:12.5px}
.slot.on{border-style:solid;background:var(--surface2)}
.slot b{font:700 15px var(--f-disp);letter-spacing:.03em}
.empty{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;padding:14px;border-radius:8px;border:1px dashed var(--line);color:var(--muted)}
.empty b{color:var(--ink)} .empty p{margin:2px 0 0;font-size:13px}
.tiers{display:grid;gap:12px}
.tierdef{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start}
.tierdef p{margin:2px 0 0;font-size:13px;color:var(--muted)}
/* score */
.score{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
.ring{width:118px;height:118px}
.parts{display:grid;gap:12px}
.part .row{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:600}
.part .nt{font-size:12px;color:var(--muted);margin-top:3px}

/* insights */
.insights{display:grid;gap:10px}
.ins{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:12px 14px;border-radius:8px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line)}
.ins.good{border-left-color:var(--good)} .ins.warn{border-left-color:var(--warn)} .ins.bad{border-left-color:var(--bad)} .ins.info{border-left-color:var(--info)}
.ins .ii{width:38px;height:38px;border-radius:11px;display:grid;place-items:center}
.ins.good .ii{background:var(--good-soft);color:var(--good)} .ins.warn .ii{background:var(--warn-soft);color:var(--warn)}
.ins.bad .ii{background:var(--bad-soft);color:var(--bad)} .ins.info .ii{background:var(--info-soft);color:var(--info)}
.ins b{display:block;font-weight:600;margin-bottom:2px}
.ins p{margin:0;font-size:13px;color:var(--muted)}
.ins .act{margin-top:8px;font-size:13px;display:flex;gap:6px;align-items:flex-start;color:var(--ink)}
.plan{display:grid;gap:10px;counter-reset:step;margin:0;padding:0;list-style:none}
.plan li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:start}
.plan li::before{counter-increment:step;content:counter(step);width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 15px var(--f-disp)}
.plan b{display:block}
.plan span{font-size:13px;color:var(--muted)}
.disclaimer{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:flex-start;padding:12px;border-radius:12px;border:1px dashed var(--line)}

/* tables */
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:6px;max-height:460px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{position:sticky;top:0;z-index:1;background:var(--accent);color:var(--accent-ink);font:700 10.5px var(--f-body);letter-spacing:.06em;text-transform:uppercase;text-align:right;padding:7px 9px;white-space:nowrap}
td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tbody tr:nth-child(even) td,tr:nth-child(even) td{background:color-mix(in srgb,var(--surface2) 55%,transparent)}
th:first-child,td:first-child{text-align:left}
td.wrap{white-space:normal;min-width:160px}
tr:last-child td{border-bottom:0}
tr.clickable{cursor:pointer} tr.clickable:hover td,tr.sel td{background:var(--surface2)}

/* misc */
.sim{display:grid;gap:10px}
.sim input[type=range]{width:100%;accent-color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,128px),1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-width:0;display:grid;gap:2px;align-content:start}
.kpi .label{font-size:10.5px;font-weight:700;letter-spacing:.07em}
.kpi .v{font:700 clamp(22px,2.4vw,28px)/1.05 var(--f-disp);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi .s{font-size:11.5px;color:var(--muted)}
.kpi .v.pos,.v.pos{color:var(--good)} .kpi .v.neg,.v.neg{color:var(--bad)}
.btn{appearance:none;border:0;background:var(--accent);color:var(--accent-ink);font:600 13px var(--f-body);padding:9px 14px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;text-decoration:none}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.ladder{display:grid;gap:14px}
.ladder .t{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px;margin-bottom:6px}
@media (prefers-reduced-motion:no-preference){.bar>i{transition:width .4s}.iconbtn,.btn,.fbtn{transition:background .15s}}

//CORE-START
const DAY=86400000;
const SHEET_ID='1ksLMRppCG9WG6h_X4ppXH6UbcibHss21Yv_pgR5LxTU';
const SHEET_URL='https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/edit';
let DATA=null, INCOME=0, REF_RATE=8.25, TIERS0=[];
const sum=(a,k)=>a.reduce((s,x)=>s+(typeof k==='function'?k(x):x[k]),0);
const parseD=s=>{const [y,m,d]=s.split('-').map(Number);return {y,m,d};};
const vnMs=(y,m0,d)=>Date.UTC(y,m0,d)-7*36e5;
const serialISO=n=>new Date(Math.round((n-25569)*DAY)).toISOString().slice(0,10);
function addM(s,n){const {y,m,d}=parseD(s);let dt=new Date(Date.UTC(y,m-1+n,d));if(dt.getUTCDate()!==d)dt=new Date(Date.UTC(y,m+n,0));return vnMs(dt.getUTCFullYear(),dt.getUTCMonth(),dt.getUTCDate());}
const todayVN=now=>Math.floor((now+7*36e5)/DAY)*DAY-7*36e5;
function savCalc(s,now){
  const {y,m,d}=parseD(s.start), start=vnMs(y,m-1,d), mat=addM(s.start,s.term), t0=todayVN(now);
  const total=Math.round((mat-start)/DAY);
  const el=Math.max(0,Math.min(total,Math.round((t0-start)/DAY)));
  const daily=s.principal*s.rate/100/365;
  return {start,mat,total,el,daily,accrued:daily*el,full:daily*total,last30:daily*Math.min(30,el),
    value:s.principal+daily*el,daysLeft:Math.max(0,Math.round((mat-t0)/DAY)),done:t0>=mat};
}
// Ví sinh lời / tiết kiệm không kỳ hạn: lãi đơn từ ngày cập nhật số dư, không đáo hạn
function flexCalc(principal,rate,startSerial,now){
  const {y,m,d}=parseD(serialISO(startSerial)), start=vnMs(y,m-1,d);
  const days=Math.max(0,Math.round((todayVN(now)-start)/DAY)), daily=principal*rate/365;
  return {start,days,daily,accrued:daily*days,last30:daily*Math.min(30,days),value:principal+daily*days};
}
// Dữ liệu phụ, đọc từ các sheet riêng (có thể chưa có): lịch sử chụp hằng ngày, dòng tiền theo tháng, mục tiêu, sổ nợ
let HIST=[], CF=[], GOALS=[], LOANS=[];
// Thu chi: trung bình tối đa 3 tháng gần nhất có số liệu ở sheet Dòng tiền; chưa có thì dùng sheet Cấu hình
function cfBasis(){
  const ms=CF.filter(m=>m.inc>0||m.exp>0).sort((a,b)=>b.m-a.m).slice(0,3);
  if(!ms.length)return null;
  const av=k=>sum(ms,k)/ms.length;
  return {n:ms.length,from:ms[ms.length-1].m,to:ms[0].m,inc:av('inc'),fixed:av('fixed'),personal:av('personal'),other:av('other')};
}
function applyData(D){
  DATA=D; REF_RATE=D.cfg.ref*100;
  TIERS0=D.tiers.map(t=>({id:t.id,name:t.name,short:t.name,def:t.def,target:t.target}));
  if(D.cfg.haircut==null)D.cfg.haircut=0.7;
  if(D.cfg.gap==null)D.cfg.gap=0;
  const cb=cfBasis();
  INCOME=cb?cb.inc:D.cfg.income;
  S.exp=cb?{personal:cb.personal,fixed:cb.fixed,other:cb.other}:{personal:D.cfg.personal,fixed:D.cfg.fixed,other:D.cfg.other};
  S.expense=Math.max(1,S.exp.personal+S.exp.fixed+S.exp.other);
  S.cf=cb;
}
const serialOf=now=>Math.floor((now+7*36e5)/DAY)+25569;
function histValue(name,daysAgo,now){
  const lim=serialOf(now)-daysAgo;let best=null;
  for(const h of HIST)if(h.d<=lim&&h.a&&h.a[name]!=null&&(!best||h.d>best.d))best=h;
  return best?best.a[name]:null;
}
const parseTier=s=>{if(!s)return null;if(/^ngo/i.test(s))return 0;const m=/^T(\d)/i.exec(s);return m?+m[1]:null;};
const typeInfo=n=>DATA.types.find(t=>t.name===n)||{tier:0,liq:false};
function kindOf(r,isSav,isFlex){
  if(isSav)return 'savings'; if(isFlex)return 'flex';
  const t=r.type||'';
  if(/^Tiền mặt/i.test(t))return 'cash'; if(/^Cổ phiếu/i.test(t))return 'stock'; if(/^Tài sản sử dụng/i.test(t))return 'durable';
  if(/^BHXH|bảo hiểm/i.test(t))return 'pension'; if(/^Kinh doanh/i.test(t))return 'biz'; if(/^Vàng/i.test(t))return 'gold';
  if(/^Crypto/i.test(t))return 'crypto'; if(/^Trái phiếu/i.test(t))return 'bond'; if(/^Bất động/i.test(t))return 'realestate';
  return 'other';
}
function newState(){return {tab:'overview',expense:13500000,exp:{personal:0,fixed:0,other:0},sim:0,filter:'all',now:null};}
function buildAssets(S,now){
  const list=DATA.rows.filter(r=>r.name).map((r,i)=>{
    const isSav=r.rate>0&&r.start>0&&r.term>0, isFlex=r.rate>0&&r.start>0&&!(r.term>0), ti=typeInfo(r.type);
    const a={id:'r'+i,name:r.name,note:r.note||'',type:r.type,kind:kindOf(r,isSav,isFlex),value:r.value||0,cost:r.cost||0,chg30:r.chg30||0,

    else{

      if(/^(stock|gold|crypto)$/.test(a.kind)){const old=histValue(a.name,30,now);if(old!=null){a.chg30=a.value-old;a.chgAuto=true;}}
    }
    if(a.kind==='biz'&&/kai/i.test(a.name)){const ks=kaiShare();if(ks){a.value=ks.value;a.cost=ks.cost;a.kaiSync=true;a.sub='Đồng bộ sheet Kai Café: vốn góp '+tr(ks.cost)+' '+(ks.opShare<0?'−':'+')+' '+pct(ks.share,0)+' lãi HĐ '+tr(Math.abs(ks.op));}}

    if(a.entitled)a.liq=false;

  LOANS.filter(l=>l.dir==='lend'&&l.left>0).forEach((l,i)=>list.push({id:'l'+i,name:l.who,note:l.note,type:'Cho vay',kind:'loan',value:l.left,cost:l.left,chg30:0,
    nw:true,tierSheet:4,autoTier:4,liq:false,receivable:true,loan:l,sub:'Cho vay'+(l.due?' · hạn '+fmtD(flexCalc(0,0,l.due,0).start):'')+(l.paid>0?' · đã thu '+tr(l.paid):''),
    brand:{color:'var(--b-loan)',icon:'handshake'}}));

// Phần của Kai ở Kai Café: vốn góp + tỷ lệ vốn × lãi hoạt động lũy kế (giá trị sổ sách; chi đầu tư không trừ vào lãi)
function kaiShare(){
  if(typeof KAI==='undefined'||!KAI||!KAI.partners)return null;
  const me=KAI.partners.find(p=>KAI_ME.test(p.who));
  if(!me||!me.cap)return null;

  return {cost:me.cap,share:me.share,op:KAI.op,opShare,value:Math.round(me.cap+opShare)};
}
const tierOf=(S,a)=>a.receivable?4:a.tierSheet!=null?a.tierSheet:a.autoTier;
const MARKET=/^(stock|crypto)$/;
// Ba lớp thanh khoản: dùng ngay (ví, tiền mặt, sổ đã đáo hạn) · rút sớm sổ (chỉ được gốc, mất lãi) · bán tài sản thị trường (nhân hệ số)
function liquidity(inNW){
  const L={now:0,soon:0,market:0}, hc=DATA.cfg.haircut;
  for(const a of inNW){if(!a.liq||a.entitled||a.receivable)continue;
    if(a.kind==='savings'&&!a.sv.done)L.soon+=a.principal;
    else if(MARKET.test(a.kind))L.market+=a.value*hc;
    else L.now+=a.value;}
  L.total=L.now+L.soon+L.market;return L;
}
// Nghỉ việc N tháng: tiêu lần lượt lớp dùng ngay → sổ → bán tài sản thị trường
function gapSim(C,n){
  const need=n*C.essential;let rem=need;const use={now:0,soon:0,market:0};
  for(const k of ['now','soon','market']){const t=Math.min(C.L[k],rem);use[k]=t;rem-=t;}
  return {need,use,short:rem,left:C.L.total-need+rem,soonFrom:C.L.now<need?Math.floor(C.L.now/C.essential)+1:0,marketFrom:C.L.now+C.L.soon<need?Math.floor((C.L.now+C.L.soon)/C.essential)+1:0};
}
const isLiquid=a=>!!a.liq;
const SIM_SRC={cash:0,flex:1,savings:2};
function towerRows(tower){
  const tw=sum(tower,'value');
  return {tw,rows:TIERS0.map(t=>{
    const target=+t.target||0, items=tower.filter(a=>a.tier===t.id);
    const value=sum(items,'value'), share=tw?value/tw:0, chg=sum(items,'chg30');
    return {...t,target,items,value,share,ratio:target?share/(target/100):0,gap:value-target/100*tw,chg,chgPct:(value-chg)?chg/(value-chg):0};})};
}
// Mục tiêu: còn thiếu, số tháng còn lại, cần để dành mỗi tháng
function goalsCalc(now,net){
  const today=serialOf(now);
  const gs=GOALS.map(g=>{
    const left=Math.max(0,g.need-g.have), months=g.due?Math.max(0,(g.due-today)/30.44):null;
    const monthly=left<=0?0:months==null?null:months<1?left:left/months;
    const st=left<=0?'done':g.due&&g.due<today?'late':monthly==null?'open':'run';
    return {...g,left,months,monthly,st,pct:g.need>0?Math.min(1,g.have/g.need):0};
  }).sort((a,b)=>(a.prio||9)-(b.prio||9)||(a.due||9e9)-(b.due||9e9));
  let budget=Math.max(0,net);
  for(const g of gs)if(g.st==='run'){g.ok=g.monthly<=budget+0.5;budget=Math.max(0,budget-g.monthly);}
  return {list:gs,monthly:sum(gs.filter(g=>g.st==='run'),'monthly')};
}
function compute(S){
  const now=S.now||Date.now();
  // số liệu chụp sẵn hoặc lưu trên máy từ trước khi có Cấu hình B19–B21: dùng mặc định
  const cf=DATA.cfg;cf.riskCap=cf.riskCap||0.15;cf.keepM=cf.keepM||2;cf.matWarn=cf.matWarn||15;
  const assets=buildAssets(S,now).map(a=>({...a,tier:tierOf(S,a)}));
  const essential=Math.max(1,(S.exp.fixed+S.exp.personal)||S.expense);
  const targetM=Math.max(DATA.cfg.emin||6,DATA.cfg.gap||0), emTarget=targetM*essential;
  // Mô phỏng: lấy tiền thanh khoản (ví, tiền mặt, sổ) vượt mục tiêu quỹ khẩn cấp, chia vào các tầng đang thiếu theo tỷ lệ phần thiếu
  const src=assets.filter(a=>a.nw&&a.kind in SIM_SRC);
  const maxSim=Math.max(0,Math.floor((sum(src,'value')-emTarget)/1e6)*1e6);
  const X=Math.min(S.sim,maxSim);
  const pre=towerRows(assets.filter(a=>a.nw&&a.tier>0));
  const defic=pre.rows.filter(r=>r.gap<0), defSum=-sum(defic,'gap');
  const simW={};defic.forEach(r=>simW[r.id]=defSum?-r.gap/defSum:0);
  if(X>0&&defic.length){
    let rem=X;
    for(const a of [...src].sort((x,y)=>SIM_SRC[x.kind]-SIM_SRC[y.kind]||(x.daysLeft||0)-(y.daysLeft||0))){
      const t=Math.min(a.value,rem);a.value-=t;a.cost=Math.max(0,a.cost-t);if(a.principal)a.principal=Math.max(0,a.principal-t);rem-=t;if(rem<=0)break;}
    for(const r of defic) assets.push({id:'sim'+r.id,name:'Mô phỏng vào T'+r.id,sub:'Tiền chuyển từ ví, sổ tiết kiệm',kind:'sim',type:'sim',tier:r.id,liq:true,
      value:X*simW[r.id],cost:X*simW[r.id],chg30:0,nw:true,sim:true,brand:{color:'var(--c'+r.id+')',icon:'target'}});
  }
  const inNW=assets.filter(a=>a.nw);
  const entitled=inNW.filter(a=>a.entitled), receivables=inNW.filter(a=>a.receivable);
  const tower=inNW.filter(a=>a.tier>0);
  const payable=sum(LOANS.filter(l=>l.dir==='borrow'&&l.left>0),'left');
  const debt=(DATA.cfg.debt||0)+payable, nw=sum(inNW,'value')-debt;
  const entV=sum(entitled,'value'), recV=sum(receivables,'value'), nwAvail=nw-entV-recV;
  const {tw,rows}=towerRows(tower);
  const L=liquidity(inNW), liquid=L.total;
  const costed=inNW.filter(a=>a.cost>0&&!a.receivable);
  const costBase=sum(costed,'cost');
  const pnlTrue=sum(costed,'value')-costBase;
  // lãi/lỗ đầu tư không gồm xe, laptop: khấu hao là hao mòn đồ dùng, không phải lỗ đầu tư
  const inv=costed.filter(a=>a.kind!=='durable'), invBase=sum(inv,'cost'), pnlInv=sum(inv,'value')-invBase;
  const durC=costed.filter(a=>a.kind==='durable'), depr=sum(durC,'value')-sum(durC,'cost');
  const chg30=sum(inNW,'chg30');
  const outside=inNW.filter(a=>a.tier===0&&!a.receivable);
  const runway=liquid/essential;
  const cashIdle=sum(inNW.filter(a=>a.kind==='cash'),'value');
  const interestMonthly=sum(inNW.filter(a=>(a.sv&&!a.sv.done)||a.fx),a=>(a.sv||a.fx).daily*30.4);
  const net=INCOME-S.expense, sr=INCOME>0?net/INCOME:0;
  const h=health(rows,runway,debt,nw,targetM,sr,DATA.cfg.insured);
  const goals=goalsCalc(now,net);
  const acc=accCalc(inNW,net);
  // Trước khi gửi sổ: tiền dùng ngay (ví, tiền mặt) còn lại sau khi chuyển ngưỡng B16 vào sổ phải đủ B20 tháng chi thiết yếu + nợ phải trả trong 60 ngày
  if(acc){const lock=acc.w.liq?Math.min(acc.have,acc.goal):0, today=serialOf(now),
    dueSoon=sum(LOANS.filter(l=>l.dir==='borrow'&&l.left>0&&l.due&&l.due-today<=60),'left'), keep=DATA.cfg.keepM*essential+dueSoon, after=L.now-lock;
    // số nên gửi tính tại lúc ví vừa đủ ngưỡng (chưa đủ thì giả định ví lên tới ngưỡng, các khoản khác giữ nguyên)
    const atGoal=acc.w.liq?after+acc.goal:L.now;
    acc.chk={lock,after,keep,dueSoon,months:after/essential,ok:after>=keep,safe:Math.min(acc.goal,Math.max(0,Math.floor((atGoal-keep)/1e7)*1e7))};}
  // Trần cổ phiếu + crypto (Cấu hình B19, Kai chọn 15% tài sản ròng)
  const risky=sum(inNW.filter(a=>MARKET.test(a.kind)),'value'), riskShare=risky/Math.max(nw,1);
  return {S,now,risky,riskShare,debt,payable,assets,inNW,tower,outside,entitled,entV,receivables,recV,nw,nwAvail,tw,L,liquid,essential,targetM,emTarget,costBase,pnlTrue,invBase,pnlInv,depr,chg30,chgPct:chg30/((nw-chg30)||1),rows,runway,h,X,maxSim,simW,
    cashIdle,interestMonthly,net,sr,goals,acc,targetSum:sum(rows,'target')};
}
// Quy tắc của Kai: tiền dư mỗi tháng chuyển vào ví tích lũy (Cấu hình B17), đủ ngưỡng (B16) thì mở sổ tiết kiệm
function accCalc(inNW,net){
  const name=(DATA.cfg.saveWallet||'Zalopay').toLowerCase(), goal=DATA.cfg.saveGoal||100000000;
  const w=inNW.find(a=>a.name.toLowerCase()===name)||inNW.find(a=>a.name.toLowerCase().includes(name));
  if(!w)return null;
  const last=[...CF].reverse().find(m=>m.inc>0||m.exp>0);
  const surplus=last?last.inc-last.exp:net, left=Math.max(0,goal-w.value);
  const months=left<=0?0:surplus>0?Math.ceil(left/surplus):null;
  let eta=null;if(months){const t=new Date(Date.now()+7*36e5);t.setUTCMonth(t.getUTCMonth()+months);eta=(t.getUTCMonth()+1)+'/'+t.getUTCFullYear();}
  return {w,have:w.value,goal,left,surplus,last,months,eta,ready:left<=0};
}
// Điểm sức khỏe v2 (100): Dự phòng 25 · Dòng tiền 20 · Phân bổ 25 · Đa dạng hóa 15 · Nợ & bảo vệ 15 (nợ 10 + bảo hiểm 5)
function health(rows,runway,debt,nw,targetM,sr,insured){
  const res=25*Math.min(runway/targetM,1);
  const flow=20*Math.max(0,Math.min(sr/0.2,1));
  const tsum=sum(rows,'target')||100;
  const tv=.5*rows.reduce((s,r)=>s+Math.abs(r.share-r.target/tsum),0);
  const alloc=25*(1-tv);
  const t3=rows.find(r=>r.id===3), t3v=t3.value;
  const hhi=t3v>0?t3.items.reduce((s,a)=>s+Math.pow(a.value/t3v,2),0):1;
  const conc=15*(1-hhi);
  const debtS=debt>0?Math.max(0,10*(1-debt/Math.max(nw,1))):10, prot=insured==='Có'?5:0;
  const total=res+flow+alloc+conc+debtS+prot;
  const label=total>=80?'Tốt':total>=60?'Khá':total>=40?'Trung bình':'Yếu';
  return {total,label,tv,hhi,parts:[
    {k:'Dự phòng',v:res,max:25,note:'Đủ '+nf(runway,1)+' tháng chi thiết yếu, mục tiêu '+targetM+' tháng'},
    {k:'Dòng tiền',v:flow,max:20,note:'Để dành '+pct(sr,0)+' thu nhập, đủ điểm từ 20%'},
    {k:'Phân bổ tháp',v:alloc,max:25,note:'Lệch '+pct(tv,0)+' so với mục tiêu các tầng'},
    {k:'Đa dạng hóa',v:conc,max:15,note:t3v>0?'Chỉ số tập trung tầng Tăng trưởng '+nf(hhi,2)+' (1,00 là một mã duy nhất)':'Chưa có tài sản tăng trưởng'},
    {k:'Nợ & bảo vệ',v:debtS+prot,max:15,note:(debt>0?'Nợ '+tr(debt):'Không nợ')+' · '+(insured==='Có'?'có bảo hiểm sức khỏe/tai nạn':insured==='Không'?'chưa có bảo hiểm sức khỏe/tai nạn riêng':'chưa ghi bảo hiểm ở Cấu hình B15')}
  ]};
}

const logo=a=>{const im=a.brand.logo&&logoImg(a.brand.logo);return im?`<span class="logo img" title="${esc(a.name)}">${im}</span>`:`<span class="logo" style="--lc:${a.brand.color}">${a.brand.icon?ic(a.brand.icon):esc(a.brand.text)}</span>`;};

const S=newState();
applyData(SNAP);
const TABS=[['overview','Tổng quan','home'],['tower','Tháp','tower'],['assets','Tài sản','wallet'],['kai','Kai Café','coffee'],['analysis','Phân tích','pulse'],['perf','Hiệu suất','chart']];
try{const h=(location.hash||'').slice(1);if(TABS.some(t=>t[0]===h))S.tab=h;}catch(_){}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tcol=id=>`var(--c${id})`;
const tierName=t=>t===0?'Ngoài tháp':'T'+t+' '+((TIERS0[t-1]||{}).short||'');

// ---- biểu đồ
function heroPyramid(rows){
  const top=30,H=208,lh=H/4,cx=110,hb=100,gap=4, hw=y=>hb*(y-top+6)/(H+6);
  let defs='',out='';
  [4,3,2,1].forEach((id,i)=>{
    const r=rows.find(x=>x.id===id), y0=top+i*lh+gap/2, y1=top+(i+1)*lh-gap/2;
    const pts=`${cx-hw(y0)},${y0} ${cx+hw(y0)},${y0} ${cx+hw(y1)},${y1} ${cx-hw(y1)},${y1}`;
    const f=Math.min(r.ratio,1), fy=y1-f*(y1-y0);
    defs+=`<clipPath id="hc${id}"><rect x="0" y="${fy}" width="230" height="${f*(y1-y0)+.5}"/></clipPath>`;
    const yc=(y0+y1)/2;
    out+=`<g class="layer" data-tier="${id}" tabindex="0" role="button" aria-label="Xem tài sản tầng ${id} ${esc(r.name)}" data-tip="T${id} ${esc(r.name)}: ${tr(r.value)} · ${pct(r.share,0)} (mục tiêu ${r.target}%)">
      <polygon points="${pts}" fill="var(--hero-ink)" fill-opacity=".10"/>
      <polygon points="${pts}" clip-path="url(#hc${id})" fill="var(--h${id})"/>
      <text class="gl" x="${cx}" y="${yc+5}" text-anchor="middle">T${id}</text>
      <line x1="${cx+hw(yc)+6}" y1="${yc}" x2="252" y2="${yc}" stroke="var(--hero-mute)" stroke-opacity=".45" stroke-dasharray="2 3"/>
      <text class="tn" x="260" y="${yc-2}">${esc(r.short)}</text>
      <text class="tv" x="260" y="${yc+14}">${pct(r.share,0)} · mục tiêu ${r.target}%</text>
    </g>`;
  });
  const flag=`<line x1="${cx}" y1="${top-4}" x2="${cx}" y2="8" stroke="var(--hero-ink)" stroke-opacity=".7" stroke-width="2"/><polygon points="${cx},8 ${cx+20},14 ${cx},20" fill="var(--h2)"/>`;
  const ground=`<line x1="4" y1="${top+H+8}" x2="236" y2="${top+H+8}" stroke="var(--hero-mute)" stroke-opacity=".5" stroke-width="2"/>`;
  return `<svg class="hp" viewBox="0 0 400 252" role="group" aria-label="Tháp tài sản 4 tầng">${'<defs>'+defs+'</defs>'}${ground}${flag}${out}</svg>`;
}
function pyramid(rows){
  const top=10,H=250,lh=H/4,cx=150,hb=140,gap=4, hw=y=>hb*(y-top+4)/(H+4);
  let defs='',out='';
  [4,3,2,1].forEach((id,i)=>{
    const r=rows.find(x=>x.id===id), y0=top+i*lh+gap/2, y1=top+(i+1)*lh-gap/2;
    const pts=`${cx-hw(y0)},${y0} ${cx+hw(y0)},${y0} ${cx+hw(y1)},${y1} ${cx-hw(y1)},${y1}`;
    const f=Math.min(r.ratio,1), fy=y1-f*(y1-y0), yc=(y0+y1)/2, dv=r.share*100-r.target;
    defs+=`<clipPath id="pc${id}"><rect x="0" y="${fy}" width="300" height="${f*(y1-y0)+.5}"/></clipPath>`;
    out+=`<g class="layer" data-tier="${id}" tabindex="0" role="button" aria-label="Xem tài sản tầng ${id}" data-tip="T${id} ${esc(r.name)}: ${tr(r.value)} · đạt ${nf(r.ratio,1)} lần mục tiêu">
      <polygon points="${pts}" fill="${tcol(id)}" fill-opacity=".16"/>
      <polygon points="${pts}" clip-path="url(#pc${id})" fill="${tcol(id)}"/>
      <text x="${cx}" y="${yc+5}" text-anchor="middle" class="v" style="font:700 14px var(--f-disp);fill:var(--surface)">${id===4?'T4':`T${id} · ${pct(r.share,0)}`}</text>
      <text x="${cx+hw(yc)+8}" y="${yc-1}" class="dv ${dv>0.5?'pos':dv<-0.5?'neg':''}">${dv>=0?'+':'−'}${nf(Math.abs(dv),0)} điểm</text>
      <text x="${cx+hw(yc)+8}" y="${yc+13}">${id===4?pct(r.share,0)+' · ':''}mục tiêu ${r.target}%</text>
    </g>`;
  });
  return `<svg class="chart" viewBox="0 0 380 264" style="max-width:440px;margin:0 auto" role="group" aria-label="Tháp so với mục tiêu"><defs>${defs}</defs>${out}</svg>`;
}
function allocBars(C){
  const mx=Math.max(...C.rows.map(r=>Math.max(r.share,r.target/100)))*1.08||1;
  return `<div class="abars">${C.rows.map(r=>`<div class="ab" data-tip="T${r.id} ${esc(r.name)}: ${tr(r.value)} · thực tế ${pct(r.share,1)}, mục tiêu ${r.target}%">
    <div class="ab-h"><span><i class="tdot" style="background:${tcol(r.id)}"></i>T${r.id} ${esc(r.name)}</span><span class="num"><b>${pct(r.share,0)}</b> <span class="muted">/ ${r.target}%</span></span></div>
    <div class="ab-t"><i style="width:${r.share/mx*100}%;background:${tcol(r.id)}"></i><em style="left:${r.target/100/mx*100}%" title="Mục tiêu"></em></div></div>`).join('')}
  </div><div class="legend"><span><i class="tdot" style="background:var(--muted)"></i>Thực tế</span><span><i style="width:2px;height:12px;background:var(--ink);display:inline-block"></i>Mục tiêu</span></div>`;
}
function donut(segs,center,sub){
  const tot=sum(segs,'v')||1, r=62, w=20, C=2*Math.PI*r, gap=2.5;
  let acc=0;
  const arcs=segs.filter(s=>s.v>0).map(s=>{const len=s.v/tot*C;
    const el=`<circle cx="80" cy="80" r="${r}" fill="none" stroke="${s.col}" stroke-width="${w}" stroke-dasharray="${Math.max(0.5,len-gap)} ${C}" stroke-dashoffset="${-acc}" transform="rotate(-90 80 80)" data-tip="${esc(s.label)}: ${tr(s.v)} · ${pct(s.v/tot,1)}"/>`;
    acc+=len;return el;}).join('');
  return `<svg class="chart" viewBox="0 0 160 160" style="max-width:170px" role="img" aria-label="Cơ cấu tài sản">${arcs}
    <text x="80" y="78" text-anchor="middle" class="v" style="font:700 22px var(--f-disp);fill:var(--ink)">${center}</text>
    <text x="80" y="97" text-anchor="middle">${sub}</text></svg>`;
}
function accCard(C){
  const a=C.acc, p=Math.min(1,a.have/a.goal), cash=C.inNW.filter(x=>x.kind==='cash');
  const lm=a.last?(()=>{const t=new Date((a.last.m-25569)*DAY);return (t.getUTCMonth()+1)+'/'+t.getUTCFullYear();})():'';
  return `<div class="kpis" style="margin-bottom:12px">
      <div class="kpi"><div class="label">${esc(a.w.name)}</div><div class="v">${tr(a.have)}</div><div class="s">${pct(p,0)} của ${tr(a.goal)}</div></div>
      <div class="kpi"><div class="label">Dư ${lm?'tháng '+lm:'mỗi tháng'}</div><div class="v ${cls(a.surplus)}">${trs(a.surplus)}</div><div class="s">${a.last?(a.last.planned?'thu − chi dự kiến':'thu − chi'):'theo Cấu hình'} → chuyển vào ví</div></div>
      <div class="kpi"><div class="label">${a.ready?'Đã đủ':'Còn thiếu'}</div><div class="v">${a.ready?'Mở sổ':tr(a.left)}</div><div class="s">${a.ready?'Theo quy tắc của bạn':a.months?'Khoảng '+a.months+' tháng, tới '+a.eta:'Cần tháng có tiền dư'}</div></div>
      ${cash.length?`<div class="kpi"><div class="label">Tiền mặt chi tiêu</div><div class="v">${tr(sum(cash,'value'))}</div><div class="s">Trích ra sau khi nhận lương</div></div>`:''}
    </div>
    <div class="bar" style="height:12px"><i style="width:${p*100}%;background:${a.ready?'var(--good)':'var(--c2)'}"></i></div>
    ${openCheck(C)}
    <p class="note">Quy tắc: nhận lương → trích tiền mặt chi tiêu → phần dư chuyển vào ${esc(a.w.name)} → đủ ${tr(a.goal)} thì mở sổ tiết kiệm. Ngưỡng và tên ví sửa ở Cấu hình B16, B17.</p>`;
}
// Kiểm tra trước khi gửi sổ: sau khi chuyển ngưỡng vào sổ, ví + tiền mặt còn lại có đủ sống không
function openCheck(C){
  const a=C.acc, k=a&&a.chk;if(!k)return '';
  const need=`${nf(DATA.cfg.keepM,0)} tháng chi thiết yếu (${tr(DATA.cfg.keepM*C.essential)})${k.dueSoon?' + nợ phải trả trong 60 ngày '+tr(k.dueSoon):''}`;
  return `<div class="chk ${k.ok?'ok':'bad'}"><b>${ic(k.ok?'check':'alert','sm')} ${a.ready?'Gửi '+tr(k.lock)+' vào sổ':'Khi ví đủ '+tr(a.goal)+' mà gửi hết vào sổ'}: ${k.ok?'vẫn đủ sống':'tiền dùng ngay sẽ thiếu'}</b>
    <span>Ví, tiền mặt còn lại khoảng ${tr(Math.max(0,k.after))}, đủ ${nf(Math.max(0,k.months),1)} tháng chi thiết yếu. Cần giữ ${need}.</span>
    ${k.ok?'':`<span>${k.safe>0?'Nên gửi khoảng '+tr(k.safe)+', phần còn lại để trong ví':'Chưa nên gửi'}, chờ thêm thu nhập rồi gửi tiếp. Sổ vẫn rút sớm được nhưng mất lãi.</span>`}</div>`;
}
function cfChart(){
  const ms=CF.filter(m=>m.inc>0||m.exp>0).slice(-12);
  if(!ms.length)return '';
  const W=360,H=150,L=4,R=4,T=10,B=24, mx=Math.max(1,...ms.flatMap(m=>[m.inc,m.exp])), slot=(W-L-R)/ms.length, bw=Math.min(14,slot/2.6);
  const y=v=>T+(1-v/mx)*(H-T-B), lab=m=>{const t=new Date((m-25569)*DAY);return (t.getUTCMonth()+1)+'/'+String(t.getUTCFullYear()).slice(2);};
  return `<div class="label" style="margin:16px 0 6px">Theo tháng (sheet Dòng tiền)</div><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Thu chi theo tháng">
    <line x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}" stroke="var(--line)"/>
    ${ms.map((m,i)=>{const cx=L+slot*(i+.5);return `<g data-tip="${lab(m.m)}: thu ${tr2(m.inc)}, chi ${tr2(m.exp)}, dư ${trs(m.inc-m.exp)}${m.inc?' ('+pct((m.inc-m.exp)/m.inc,0)+')':''}">
      <rect x="${cx-bw-1}" y="${y(m.inc)}" width="${bw}" height="${H-B-y(m.inc)}" rx="3" fill="var(--good)"/>
      <rect x="${cx+1}" y="${y(m.exp)}" width="${bw}" height="${H-B-y(m.exp)}" rx="3" fill="var(--bad)" fill-opacity=".8"/>
      <rect x="${cx-slot/2}" y="${T}" width="${slot}" height="${H-T-B}" fill="transparent"/>
      <text x="${cx}" y="${H-8}" text-anchor="middle">${lab(m.m)}</text></g>`;}).join('')}
  </svg><div class="legend"><span><i class="tdot" style="background:var(--good)"></i>Thu</span><span><i class="tdot" style="background:var(--bad)"></i>Chi</span></div>`;
}
function cashflow(){
  const inc=Math.max(INCOME,1), net=INCOME-S.expense;
  const parts=[['Chi cố định',S.exp.fixed,'var(--c1)'],['Chi cá nhân',S.exp.personal,'var(--c2)'],['Chi khác',S.exp.other,'var(--c4)'],['Còn dư',Math.max(0,net),'var(--good)']].filter(p=>p[1]>0);
  const base=Math.max(inc,S.expense);
  return `<div class="stack" role="img" aria-label="Thu nhập chia theo khoản chi">${parts.map(p=>`<i style="width:${p[1]/base*100}%;background:${p[2]}" data-tip="${p[0]}: ${tr2(p[1])} · ${pct(p[1]/inc,0)} thu nhập"></i>`).join('')}</div>
    <div class="legend">${parts.map(p=>`<span><i class="tdot" style="background:${p[2]}"></i>${p[0]} <b class="num" style="color:var(--ink)">${tr2(p[1])}</b></span>`).join('')}</div>
    <div class="kpis" style="margin-top:14px">
      <div class="kpi"><div class="label">Thu nhập</div><div class="v">${tr2(INCOME)}</div><div class="s">mỗi tháng</div></div>
      <div class="kpi"><div class="label">Tổng chi</div><div class="v">${tr2(S.expense)}</div><div class="s">${pct(S.expense/inc,0)} thu nhập</div></div>
      <div class="kpi"><div class="label">Để dành</div><div class="v ${cls(net)}">${trs(net)}</div><div class="s">${pct(net/inc,0)} thu nhập</div></div>
    </div>${net<0?'<p class="note neg">Chi đang vượt thu.</p>':''}
    <p class="note">${S.cf?'Trung bình '+S.cf.n+' tháng gần nhất ở sheet Dòng tiền.':'Lấy từ sheet Cấu hình. Ghi thu chi từng tháng ở sheet Dòng tiền để app tính trung bình thật.'}</p>${cfChart()}`;
}
const LAYERS=[['now','Dùng ngay','var(--good)','Ví, tiền mặt, sổ đã đáo hạn'],['soon','Rút sớm sổ tiết kiệm','var(--c1)','Chỉ tính tiền gốc vì rút trước hạn mất lãi'],['market','Bán cổ phiếu','var(--c4)','Tính theo hệ số trong sheet Cấu hình']];
function emergency(C){
  const cfg=DATA.cfg, tm=C.targetM, mx=Math.max(C.runway,tm)*1.15, p=v=>Math.min(100,v/mx*100), E=C.essential;
  const n=S.gap||tm, g=gapSim(C,n);
  const stack=LAYERS.filter(l=>C.L[l[0]]>0).map(l=>`<i style="width:${C.L[l[0]]/C.L.total*100}%;background:${l[2]}" data-tip="${l[1]}: ${tr(C.L[l[0]])} · ${nf(C.L[l[0]]/E,1)} tháng"></i>`).join('');
  let story=`Cần ${tr(g.need)} cho ${n} tháng chi thiết yếu. `;
  if(g.short>0) story+=`Thiếu ${tr(g.short)}: thanh khoản chỉ đủ ${nf(C.runway,1)} tháng.`;
  else{
    story+=g.soonFrom?`Ví và tiền mặt đủ ${g.soonFrom-1} tháng, từ tháng ${g.soonFrom} phải rút sổ tiết kiệm`:`Chỉ dùng ví và tiền mặt là đủ`;
    story+=g.marketFrom?`, từ tháng ${g.marketFrom} phải bán cổ phiếu`:'';
    story+=`. Sau ${n} tháng còn khoảng ${tr(g.left)} thanh khoản.`;
  }
  return `<div class="kpis" style="margin-bottom:12px">
      <div class="kpi"><div class="label">Đủ sống</div><div class="v">${nf(C.runway,1)} th</div><div class="s">Mục tiêu ${tm} tháng</div></div>
      <div class="kpi"><div class="label">Chi thiết yếu</div><div class="v">${tr2(E)}</div><div class="s">Cố định + cá nhân/tháng</div></div>
      <div class="kpi"><div class="label">Mục tiêu quỹ</div><div class="v">${tr(C.emTarget)}</div><div class="s">${cfg.gap>=cfg.emin?'= khoảng nghỉ việc dài nhất':'= mức tối thiểu bạn đặt'}</div></div>
    </div>
    <div class="gauge" data-tip="Thanh khoản ${tr(C.liquid)} ÷ chi thiết yếu ${tr2(E)}/tháng = ${nf(C.runway,1)} tháng">
      <div class="g-t"><span class="zone" style="left:${p(tm)}%;width:${100-p(tm)}%"></span><i style="width:${p(C.runway)}%"></i><b style="left:${p(C.runway)}%"></b></div>
      <div class="g-l"><span style="left:0">0</span><span style="left:${p(tm)}%">${tm} th</span><span style="left:${p(C.runway)}%;color:var(--ink);font-weight:700">${nf(C.runway,1)}</span></div>
    </div>
    <div class="label" style="margin:14px 0 6px">Thanh khoản gồm 3 lớp</div>
    <div class="stack" role="img" aria-label="Ba lớp thanh khoản">${stack}</div>
    <div class="legend">${LAYERS.map(l=>`<span title="${l[3]}"><i class="tdot" style="background:${l[2]}"></i>${l[1]} <b class="num" style="color:var(--ink)">${tr(C.L[l[0]])}</b></span>`).join('')}</div>
    <div class="sim" style="margin-top:16px">
      <label class="label" for="gap">Nếu nghỉ việc <b class="num" style="color:var(--ink)">${n} tháng</b></label>
      <input id="gap" type="range" min="1" max="24" step="1" value="${n}">
      <p class="note" style="margin:0">${story}</p>
    </div>`;
}
function projection(C){
  const net=INCOME-S.expense, step=net+C.interestMonthly, pts=[];
  for(let m=0;m<=12;m++)pts.push(C.nw+step*m);
  const W=360,H=170,L=8,R=64,T=14,B=26, lo=Math.min(...pts), hi=Math.max(...pts), pad=(hi-lo)*.15||C.nw*.02||1;
  const y0=lo-pad, y1=hi+pad, x=m=>L+m/12*(W-L-R), y=v=>T+(1-(v-y0)/(y1-y0))*(H-T-B);
  const line=pts.map((v,m)=>`${m?'L':'M'}${x(m).toFixed(1)},${y(v).toFixed(1)}`).join('');
  const area=line+`L${x(12)},${H-B}L${x(0)},${H-B}Z`;
  const ticks=[y0+(y1-y0)*.15,y0+(y1-y0)*.5,y0+(y1-y0)*.85];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Ước tính tài sản ròng 12 tháng">
    ${ticks.map(t=>`<line x1="${L}" x2="${W-R+4}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-dasharray="2 4"/><text x="${W-R+8}" y="${y(t)+4}">${trn(t)} Tr</text>`).join('')}
    <path d="${area}" fill="var(--accent)" fill-opacity=".12"/>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="${x(0)}" cy="${y(pts[0])}" r="4" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"/>
    <circle cx="${x(12)}" cy="${y(pts[12])}" r="5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>
    <text x="${x(12)}" y="${y(pts[12])-11}" text-anchor="end" class="v">${tr(pts[12])}</text>
    ${[0,3,6,9,12].map(m=>`<text x="${x(m)}" y="${H-8}" text-anchor="${m===0?'start':m===12?'end':'middle'}">${m===0?'Hôm nay':'+'+m+' th'}</text>`).join('')}
    ${pts.map((v,m)=>`<rect x="${x(m)-12}" y="${T}" width="24" height="${H-T-B}" fill="transparent" data-tip="${m===0?'Hôm nay':'Sau '+m+' tháng'}: ${tr(v)}"/>`).join('')}
  </svg>
  <p class="note">Giả định giữ mức dư ${trs(net)}/tháng và lãi tiết kiệm khoảng ${tr(C.interestMonthly)}/tháng. Không tính biến động giá cổ phiếu và khấu hao.</p>`;
}
// Tài sản ròng theo ngày: các điểm Apps Script đã chụp + điểm hôm nay tính trực tiếp
function histChart(C){
  const today=serialOf(C.now);
  const pts=HIST.filter(h=>h.d<today).map(h=>({d:h.d,nw:h.nw,av:h.avail}));
  pts.push({d:today,nw:C.nw,av:C.nwAvail});
  if(pts.length<2) return `<div class="empty">${ic('calendar','lg')}<div><b>Đang chờ dữ liệu lịch sử</b><p>Apps Script lưu số liệu mỗi tối lúc 22 giờ vào sheet Lịch sử. Biểu đồ hiện từ ngày thứ hai.</p></div></div>`;
  const W=360,H=170,L=8,R=64,T=14,B=26, d0=pts[0].d, d1=pts[pts.length-1].d||d0+1;
  const all=pts.flatMap(p=>[p.nw,p.av]), lo=Math.min(...all), hi=Math.max(...all), pad=(hi-lo)*.12||hi*.02||1, y0=lo-pad, y1=hi+pad;
  const x=d=>L+(d1===d0?1:(d-d0)/(d1-d0))*(W-L-R), y=v=>T+(1-(v-y0)/(y1-y0))*(H-T-B);
  const path=k=>pts.map((p,i)=>`${i?'L':'M'}${x(p.d).toFixed(1)},${y(p[k]).toFixed(1)}`).join('');
  const ticks=[y0+(y1-y0)*.15,y0+(y1-y0)*.5,y0+(y1-y0)*.85], last=pts[pts.length-1], first=pts[0];
  const dl=s=>{const t=new Date((s-25569)*DAY);return t.getUTCDate()+'/'+(t.getUTCMonth()+1);};
  const step=Math.max(1,Math.ceil(pts.length/60));
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Tài sản ròng theo ngày">
    ${ticks.map(t=>`<line x1="${L}" x2="${W-R+4}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-dasharray="2 4"/><text x="${W-R+8}" y="${y(t)+4}">${trn(t)} Tr</text>`).join('')}
    <path d="${path('nw')}L${x(last.d)},${H-B}L${x(first.d)},${H-B}Z" fill="var(--accent)" fill-opacity=".10"/>
    <path d="${path('nw')}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>
    <path d="${path('av')}" fill="none" stroke="var(--c1)" stroke-width="2" stroke-dasharray="5 3" stroke-linejoin="round"/>
    <circle cx="${x(last.d)}" cy="${y(last.nw)}" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>
    <text x="${x(first.d)}" y="${H-8}">${dl(first.d)}</text><text x="${x(last.d)}" y="${H-8}" text-anchor="end">Hôm nay</text>
    ${pts.filter((_,i)=>i%step===0||i===pts.length-1).map(p=>`<rect x="${x(p.d)-6}" y="${T}" width="12" height="${H-T-B}" fill="transparent" data-tip="${dl(p.d)}: ${tr(p.nw)} · khả dụng ${tr(p.av)}"/>`).join('')}
  </svg>
  <div class="legend"><span><i class="tdot" style="background:var(--accent)"></i>Tài sản ròng ${trs(last.nw-first.nw)} từ ${dl(first.d)}</span><span><i class="tdot" style="background:var(--c1)"></i>Khả dụng (trừ khoản chờ nhận)</span></div>`;
}
function divBars(items,fmt){
  const mx=Math.max(1e-9,...items.map(i=>Math.abs(i.v)));
  return `<div class="dbars">${items.map(i=>{const w=Math.abs(i.v)/mx*50;
    return `<div class="db" data-tip="${esc(i.tip||i.label)}"><span class="db-l">${i.dot?`<i class="tdot" style="background:${i.dot}"></i>`:''}${esc(i.label)}</span>
      <span class="db-t"><i style="${i.v>=0?'left:50%':'right:50%'};width:${w}%;background:${i.v>=0?'var(--good)':'var(--bad)'}"></i></span>
      <span class="db-v num ${cls(i.v*1e7)}">${fmt(i.v)}</span></div>`;}).join('')}</div>`;
}
function ring(score){
  const r=46,c=2*Math.PI*r,o=c*(1-score/100);
  const col=score>=60?'var(--good)':score>=40?'var(--warn)':'var(--bad)';
  return `<svg class="ring" viewBox="0 0 110 110" role="img" aria-label="Điểm sức khỏe ${Math.round(score)}"><circle cx="55" cy="55" r="${r}" fill="none" stroke="var(--surface2)" stroke-width="10"/><circle cx="55" cy="55" r="${r}" fill="none" stroke="${col}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${o}" transform="rotate(-90 55 55)"/><text x="55" y="62" text-anchor="middle" style="font:800 30px var(--f-disp);fill:var(--ink)">${Math.round(score)}</text><text x="55" y="78" text-anchor="middle" style="font:600 9px var(--f-body);fill:var(--muted)">/ 100</text></svg>`;
}

// ---- phân tích theo quy tắc (dựa trên mục tiêu người dùng đặt trong sheet)
function insights(C){
  const L=[], E=S.expense, inc=INCOME, net=inc-E, cfg=DATA.cfg;
  const tm=C.targetM, why=cfg.gap>=cfg.emin?` (bằng khoảng nghỉ việc dài nhất bạn từng có)`:'';
  if(C.runway<tm) L.push({sev:C.runway<cfg.emin?'bad':'warn',prio:1,icon:'shield',t:`Quỹ khẩn cấp đủ ${nf(C.runway,1)} tháng, mục tiêu ${tm} tháng`,d:`Thanh khoản ${tr(C.liquid)} (cổ phiếu tính ${pct(cfg.haircut,0)}), chi thiết yếu ${tr2(C.essential)}/tháng. Mục tiêu ${tm} tháng${why} là ${tr(C.emTarget)}.`,a:`Dồn phần dư hằng tháng vào T1 cho đến khi đủ ${tr(C.emTarget)}, còn thiếu ${tr(C.emTarget-C.liquid)}.`});
  else if(C.runway>tm*1.5) L.push({sev:'warn',prio:3,icon:'shield',t:`Thanh khoản ${nf(C.runway,1)} tháng, gấp ${nf(C.runway/tm,1)} lần mục tiêu`,d:`Mục tiêu ${tm} tháng chi thiết yếu${why} là ${tr(C.emTarget)}. Bạn đang có ${tr(C.liquid)}, dư khoảng ${tr(C.liquid-C.emTarget)}.`,a:`Phần dư có thể chuyển dần sang tầng còn thiếu. Thử con số ở mục Mô phỏng của tab Tháp.`});
  else L.push({sev:'good',prio:20,icon:'shield',t:`Quỹ khẩn cấp ổn: ${nf(C.runway,1)} tháng`,d:`Đạt mục tiêu ${tm} tháng chi thiết yếu${why}.`});

  if(inc<=0) L.push({sev:'info',prio:6,icon:'flow',t:'Chưa có thu nhập tháng',d:'Nhập thu nhập ở sheet Cấu hình để tính tỷ lệ để dành.'});
  else{const sr=net/inc;
    if(net<0) L.push({sev:'bad',prio:1,icon:'flow',t:`Chi vượt thu ${tr(-net)} mỗi tháng`,d:`Thu ${tr2(inc)}, chi ${tr2(E)}. Tài sản sẽ giảm dần nếu kéo dài.`,a:'Rà lại chi cố định và chi cá nhân, đặt trần chi cho tháng tới.'});
    else if(sr<0.2) L.push({sev:'warn',prio:4,icon:'flow',t:`Để dành ${pct(sr,0)} thu nhập`,d:`Mỗi tháng dư ${tr2(net)}${S.cf?' (trung bình '+S.cf.n+' tháng)':''}. Mức tham khảo phổ biến là từ 20% thu nhập trở lên.`,a:`Thêm khoảng ${tr2(inc*0.2-net)}/tháng để đạt 20%.`});
    else L.push({sev:'good',prio:21,icon:'flow',t:`Để dành ${pct(sr,0)} thu nhập`,d:`Mỗi tháng dư ${tr2(net)}${S.cf?' (trung bình '+S.cf.n+' tháng)':''}, trên mức tham khảo 20%.`});
    if(S.exp.fixed/inc>0.35) L.push({sev:'warn',prio:5,icon:'calendar',t:`Chi cố định chiếm ${pct(S.exp.fixed/inc,0)} thu nhập`,d:`${tr2(S.exp.fixed)}/tháng cho phụ cấp gia đình, nhà ở. Khoản này khó cắt khi thu nhập giảm.`,a:`Giữ quỹ khẩn cấp đủ trả riêng chi cố định ít nhất ${tm} tháng (${tr(tm*S.exp.fixed)}). Hiện đủ ${nf(C.liquid/S.exp.fixed,0)} tháng.`});
  }

  const t3=C.rows.find(r=>r.id===3);
  if(t3&&t3.items.length===1&&!t3.items[0].sim){const a=t3.items[0], p=a.cost>0?(a.value-a.cost)/a.cost:0;
    L.push({sev:'bad',prio:2,icon:'pie',t:`Tầng Tăng trưởng chỉ có một mã: ${esc(a.name)}`,d:`${esc(a.name)} chiếm toàn bộ tầng T3 và ${pct(a.value/C.nw,0)} tài sản ròng, đang ${pcts(p)} so với vốn.`,a:'Đa dạng hóa: thêm chứng chỉ quỹ chỉ số (ETF) hoặc vài mã ở ngành khác, để kết quả của tầng không phụ thuộc một doanh nghiệp.'});}
  else if(t3&&C.h.hhi>0.5) L.push({sev:'warn',prio:4,icon:'pie',t:'Tầng Tăng trưởng còn tập trung',d:`Chỉ số tập trung ${nf(C.h.hhi,2)}. Một mã đang chiếm phần lớn tầng.`,a:'Phân bổ đều hơn giữa các mã hoặc thêm quỹ chỉ số.'});

  const tw=C.tw||1, def=[...C.rows].filter(r=>r.gap<-0.02*tw).sort((a,b)=>a.gap-b.gap), sur=[...C.rows].filter(r=>r.gap>0.02*tw).sort((a,b)=>b.gap-a.gap);
  if(def.length){const d=def[0];
    L.push({sev:'warn',prio:3,icon:'tower',t:`T${d.id} ${esc(d.name)} thiếu ${tr(-d.gap)} so với mục tiêu ${d.target}%`,
      d:`Thực tế ${pct(d.share,0)} giá trị trong tháp.${sur.length?' Tầng dư nhiều nhất: '+sur.map(r=>`T${r.id} (${trs(r.gap)})`).join(', ')+'.':''}`,
      a:sur.length?`Nếu muốn theo đúng mục tiêu đã đặt, chuyển dần từ ${sur.map(r=>'T'+r.id).join(', ')} sang ${def.map(r=>'T'+r.id).join(', ')}, chia thành nhiều đợt.`:'Dồn tiền mới vào tầng thiếu trước.'});}
  else L.push({sev:'good',prio:22,icon:'tower',t:'Tháp gần đúng mục tiêu',d:'Không tầng nào lệch quá 2% giá trị tháp.'});

  for(const a of C.inNW.filter(a=>a.kind==='stock'&&a.sym)){const p=(DATA.prices||{})[a.sym.toUpperCase()];if(!p||!p.sell||!p.price)continue;
    if(p.price>=p.sell) L.push({sev:'warn',prio:2,icon:'up',t:`${esc(a.sym)} đạt ${nf(p.price,0)}đ, chạm giá cân nhắc bán ${nf(p.sell,0)}đ`,d:`Giá trị hiện tại ${tr(a.value)}, ${a.cost>0?pcts((a.value-a.cost)/a.cost)+' so với vốn':''}.`,a:'Theo kế hoạch của bạn: cân nhắc bán. Quyết định là của bạn; đổi mức giá ở sheet Giá CP cột G.'});
    else L.push({sev:'info',prio:9,icon:'target',t:`${esc(a.sym)} ${nf(p.price,0)}đ, còn ${pct(p.sell/p.price-1,1)} tới giá cân nhắc bán ${nf(p.sell,0)}đ`,d:'App và email sẽ báo khi giá chạm mức này (sheet Giá CP cột G).'});}
  if(C.acc&&C.acc.ready){const k=C.acc.chk, left=`ví, tiền mặt còn ${tr(Math.max(0,k.after))} (${nf(Math.max(0,k.months),1)} tháng chi thiết yếu)`;
    if(k.ok) L.push({sev:'warn',prio:2,icon:'bank',t:`${esc(C.acc.w.name)} đã có ${tr(C.acc.have)}: đủ mở sổ tiết kiệm`,d:`Theo quy tắc của bạn, ví tích lũy đủ ${tr(C.acc.goal)} thì mở sổ. Gửi xong ${left}, vẫn đủ sống.`,a:'Mở sổ kỳ hạn, rồi nhắn chat ghi tài sản: "mở sổ … triệu, lãi …%, kỳ hạn … tháng".'});
    else L.push({sev:'bad',prio:1,icon:'bank',t:`Gửi ${tr(k.lock)} vào sổ thì tiền dùng ngay chỉ còn ${tr(Math.max(0,k.after))}`,d:`Gửi xong ${left}, dưới mức cần giữ ${tr(k.keep)} (${nf(cfg.keepM,0)} tháng chi thiết yếu${k.dueSoon?' + nợ sắp trả':''}, Cấu hình B20).`,a:k.safe>0?`Chỉ gửi khoảng ${tr(k.safe)}, phần còn lại để trong ví; đủ thu nhập thêm thì gửi tiếp.`:'Chưa gửi sổ, để tiền trong ví cho đến khi có thêm thu nhập.'});}
  if(C.risky>0){const cap=cfg.riskCap, rk=C.riskShare;
    if(rk>cap) L.push({sev:'warn',prio:2,icon:'shield',t:`Cổ phiếu + crypto ${pct(rk,1)} tài sản ròng, vượt trần ${pct(cap,0)}`,d:`Đang có ${tr(C.risky)}, trần ${pct(cap,0)} là ${tr(cap*C.nw)}. Giá giảm mạnh thì phần này kéo tài sản ròng xuống nhiều nhất.`,a:`Không mua thêm. Tài sản ròng tăng tới ${tr(C.risky/cap)} thì tự về dưới trần; bán hay không là quyết định của bạn.`});
    else L.push({sev:'good',prio:24,icon:'shield',t:`Cổ phiếu + crypto ${pct(rk,1)} tài sản ròng, dưới trần ${pct(cap,0)}`,d:`Còn cách trần ${tr(cap*C.nw-C.risky)}. Trần đặt ở Cấu hình B19.`});}
  for(const a of C.inNW.filter(a=>a.kind==='flex'&&a.rate<REF_RATE&&a.value>2*E&&!(C.acc&&C.acc.w===a))){const extra=a.value-2*E;
    L.push({sev:'info',prio:5,icon:'wallet',t:`${esc(a.name)} đang giữ ${tr(a.value)}, khoảng ${nf(a.value/E,1)} tháng chi tiêu`,
      d:`Lãi ${nf(a.rate,2)}%/năm, thấp hơn mức tiết kiệm tham chiếu ${nf(REF_RATE,2)}%. Phần trên 2 tháng chi tiêu (${tr(extra)}) gửi kỳ hạn sẽ thêm khoảng ${tr(extra*(REF_RATE-a.rate)/100)}/năm.`,
      a:`Giữ khoảng ${tr(2*E)} trong ví để chi tiêu, phần còn lại cân nhắc gửi kỳ hạn ngắn.`});}
  if(C.cashIdle>C.essential) L.push({sev:'warn',prio:4,icon:'coins',t:`Tiền mặt không sinh lãi ${tr(C.cashIdle)}, hơn 1 tháng chi`,d:`Mất khoảng ${tr(C.cashIdle*REF_RATE/100)}/năm so với lãi ${nf(REF_RATE,2)}%.`,a:'Chuyển sang ví sinh lời hoặc tiết kiệm, chỉ giữ tiền mặt đủ chi tiêu.'});

  const near=C.inNW.filter(a=>a.kind==='savings'&&!a.sv.done&&a.daysLeft<=365).sort((a,b)=>a.daysLeft-b.daysLeft);
  if(near.length) L.push({sev:'info',prio:7,icon:'calendar',t:`${near.length} sổ đáo hạn trong 12 tháng`,
    d:near.map(a=>`${esc(a.name)} ${fmtD(a.sv.mat)} (còn ${a.daysLeft} ngày, ${tr(a.value)})`).join('; ')+`. App và email nhắc trước ${cfg.matWarn} ngày (Cấu hình B21).`});
  for(const a of near.filter(a=>a.daysLeft<=cfg.matWarn)) L.push({sev:'warn',prio:2,icon:'calendar',t:`${esc(a.name)} đáo hạn ${fmtD(a.sv.mat)}, còn ${a.daysLeft} ngày`,
    d:`Nhận về khoảng ${tr(a.principal+a.sv.full)} (gốc ${tr(a.principal)} + lãi ${tr(a.sv.full)}).`,a:`Quyết định trước ngày đáo hạn: gửi lại ${tr(a.principal)} (so lãi vài ngân hàng), hoặc để một phần ở ví nếu tiền dùng ngay đang thiếu.`});
  const done=C.inNW.filter(a=>a.kind==='savings'&&a.sv.done);
  if(done.length) L.push({sev:'warn',prio:2,icon:'calendar',t:`${done.length} sổ đã đáo hạn`,d:done.map(a=>esc(a.name)).join(', ')+' đã hết kỳ hạn, lãi sau hạn thường rất thấp.',a:'Cập nhật lại sổ mới (ngày gửi, kỳ hạn) trong sheet.'});

  const pen=C.inNW.filter(a=>a.kind==='pension');
  if(pen.length) L.push({sev:'info',prio:8,icon:'shield',t:`${tr(sum(pen,'value'))} BHXH/BHTN đang chờ nhận`,d:`Chiếm ${pct(C.entV/(C.nw||1),0)} tài sản ròng nhưng chưa rút được: vẫn nằm trong tầng bạn chọn, nhưng không tính vào thanh khoản và tài sản khả dụng (${tr(C.nwAvail)}).`});
  const du=C.inNW.filter(a=>a.kind==='durable');
  if(du.length) L.push({sev:'info',prio:9,icon:'bike',t:`Xe, laptop mất khoảng ${tr(-sum(du,'chg30'))} mỗi tháng`,d:`${tr(sum(du,'value'))} tài sản sử dụng nằm ngoài tháp, giá trị giảm dần theo khấu hao.`});
  if(!C.debt) L.push({sev:'good',prio:23,icon:'check',t:'Không có nợ',d:'Chi phí lãi vay bằng 0, điểm nợ đạt tối đa.'});
  const today=serialOf(C.now), openL=LOANS.filter(l=>l.left>0);
  const lateLend=openL.filter(l=>l.dir==='lend'&&l.due&&l.due<today);
  if(lateLend.length) L.push({sev:'warn',prio:2,icon:'handshake',t:`${lateLend.length} khoản cho vay quá hạn`,d:lateLend.map(l=>`${esc(l.who)} còn ${tr(l.left)}, hạn ${sdate(l.due)}`).join('; ')+'.',a:'Nhắc người vay và thống nhất lịch trả mới, rồi sửa hạn ở sheet Sổ nợ.'});
  if(C.recV>0.1*Math.max(C.nwAvail+C.recV,1)) L.push({sev:'info',prio:7,icon:'handshake',t:`Cho vay ${tr(C.recV)}, bằng ${pct(C.recV/Math.max(C.nwAvail+C.recV,1),0)} tài sản khả dụng`,d:'Khoản cho vay cá nhân không có tài sản đảm bảo và khó đòi sớm khi cần.',a:'Nên đặt hạn trả cho từng khoản để app nhắc qua email.'});
  for(const l of openL.filter(l=>l.dir==='borrow')) L.push({sev:l.due&&l.due-today<=30?'warn':'info',prio:3,icon:'coins',t:`Đang nợ ${esc(l.who)} ${tr(l.left)}`,d:(l.due?'Hạn trả '+sdate(l.due)+'. ':'')+(l.rate?'Lãi '+nf(l.rate*100,1)+'%/năm.':'Không ghi lãi.'),a:l.rate*100>REF_RATE?'Lãi vay cao hơn lãi tiết kiệm: ưu tiên trả sớm khoản này.':''});
  const G=C.goals;
  if(G.monthly>Math.max(0,C.net)+0.5) L.push({sev:'warn',prio:4,icon:'flag',t:`Mục tiêu cần ${tr2(G.monthly)}/tháng, vượt mức dư ${trs(C.net)}`,d:'Theo thứ tự ưu tiên, các mục tiêu đánh dấu "Vượt mức dư" sẽ không kịp hạn nếu giữ mức để dành hiện tại.',a:'Lùi hạn hoặc giảm số tiền của mục tiêu ưu tiên thấp, hoặc tăng phần để dành.'});
  const lateG=G.list.filter(g=>g.st==='late');
  if(lateG.length) L.push({sev:'warn',prio:4,icon:'flag',t:`${lateG.length} mục tiêu đã quá hạn`,d:lateG.map(g=>esc(g.name)+' còn thiếu '+tr(g.left)).join('; ')+'.',a:'Đặt hạn mới ở sheet Mục tiêu.'});
  if(DATA.cfg.insured!=='Có') L.push({sev:'info',prio:7,icon:'shield',t:DATA.cfg.insured==='Không'?'Chưa có bảo hiểm sức khỏe/tai nạn riêng':'Chưa ghi thông tin bảo hiểm',d:'Bạn từng có nhiều khoảng nghỉ việc; khi nghỉ, bảo hiểm y tế qua công ty cũng dừng. Một khoản viện phí lớn có thể lấy mất quỹ khẩn cấp.',a:DATA.cfg.insured==='Không'?'Cân nhắc một gói bảo hiểm sức khỏe/tai nạn cơ bản, rồi đổi Cấu hình B15 thành Có.':'Chọn Có hoặc Không ở Cấu hình B15.'});
  const negM=CF.filter(m=>m.inc>0&&m.exp>m.inc);
  if(negM.length) L.push({sev:'warn',prio:4,icon:'flow',t:`${negM.length} tháng chi vượt thu`,d:negM.slice(-3).map(m=>{const t=new Date((m.m-25569)*DAY);return (t.getUTCMonth()+1)+'/'+t.getUTCFullYear()+' '+trs(m.inc-m.exp);}).join(', ')+'.',a:'Xem lại khoản chi lớn của các tháng này ở sheet Dòng tiền.'});
  return L.sort((a,b)=>a.prio-b.prio);
}

const STALE=35;
function staleAssets(C){
  const today=serialOf(C.now), out=[];
  for(const a of C.inNW){
    if(a.sim||a.receivable||a.kaiSync||a.entitled||/^(savings|durable|stock)$/.test(a.kind))continue;   // tự tính, không cần nhập lại
    let since=null;
    if(a.fx)since=today-serialOf(a.fx.start);
    else{
      const pts=HIST.filter(h=>h.a&&h.a[a.name]!=null).sort((x,y)=>x.d-y.d);
      if(pts.length<2||today-pts[0].d<STALE)continue;

// Ô tỷ lệ (treemap, chia ô vuông dần): mỗi ô một tài sản, diện tích theo giá trị, màu theo tầng
function squarify(items,W,H){
  const out=[], tot=sum(items,'v')||1;let x=0,y=0,w=W,h=H, rest=items.map(i=>({...i,ar:i.v/tot*W*H}));
  const worst=(row,s)=>{const sm=sum(row,'ar'),mx=Math.max(...row.map(r=>r.ar)),mn=Math.min(...row.map(r=>r.ar));return Math.max(s*s*mx/(sm*sm),sm*sm/(s*s*mn));};
  while(rest.length){
    const s=Math.min(w,h);let row=[rest[0]],best=worst(row,s),i=1;
    while(i<rest.length){const t=[...row,rest[i]],wv=worst(t,s);if(wv<=best){row=t;best=wv;i++;}else break;}
    const th=sum(row,'ar')/s;let off=0;
    for(const r of row){const len=r.ar/th;out.push(w>=h?{...r,x,y:y+off,w:th,h:len}:{...r,x:x+off,y,w:len,h:th});off+=len;}
    if(w>=h){x+=th;w-=th;}else{y+=th;h-=th;}
    rest=rest.slice(row.length);
  }
  return out;
}

  const W=160,H=110, tot=sum(items,'v')||1, cells=squarify(items,W,H);

function rulesCheck(C){
  const cfg=DATA.cfg, goal=cfg.saveGoal||100000000, today=serialOf(C.now), a=C.acc, out=[];
  const prev=n=>{let b=null;for(const h of HIST)if(h.d<today&&h.a&&h.a[n]!=null&&(!b||h.d>b.d))b=h;return b?b.a[n]:null;};

  if(a){
    let over=0;if(a.have>goal){over=1;for(const h of [...HIST].sort((x,y)=>y.d-x.d)){if(h.a&&h.a[a.w.name]>goal)over=today-h.d;else break;}}

    out.push(['04','Chạm '+tr(goal)+' thì mở sổ ngay',a.ready?['warn','Đến lúc mở sổ']:['good','Chưa tới'],a.ready?'Đủ tiền, mở sổ trong tuần này':'Còn thiếu '+tr(a.left)]);
  }
  const big=so.filter(x=>x.principal>goal*1.1);
  out.push(['05','Nhiều sổ khoảng '+tr(goal)+' thay vì một sổ lớn',big.length?['warn','Cần chú ý']:['good','Đạt'],big.length?'Sổ lớn: '+big.map(x=>esc(x.name)+' '+tr(x.principal)).join(', '):so.length+' sổ, sổ lớn nhất '+(so.length?tr(Math.max(...so.map(x=>x.principal))):'–')]);
  const r3=C.rows.find(r=>r.id===3), r4=C.rows.find(r=>r.id===4), risk=(r3?r3.share:0)+(r4?r4.share:0), lim=((r3?r3.target:0)+(r4?r4.target:0))/100;
  out.push(['06','Ổn định hơn tăng trưởng, không FOMO',risk<=lim+0.05?['good','Đạt']:['warn','Cần chú ý'],'T3 + T4 đang '+pct(risk,0)+', mục tiêu '+pct(lim,0)]);
  out.push(['07','Cổ phiếu + crypto không quá '+pct(cfg.riskCap,0)+' tài sản ròng',C.riskShare<=cfg.riskCap?['good','Đạt']:['warn','Vượt trần'],'Đang '+pct(C.riskShare,1)+' · '+tr(C.risky)]);
  return out;
}

function cellMap(res){
  const sheets=(res&&res.sheets)||[], out={};
  for(const sh of sheets){const t=sh.properties&&sh.properties.title;out[t]=out[t]||{};
    for(const d of (sh.data||[])){const r0=d.startRow||0,c0=d.startColumn||0;
      (d.rowData||[]).forEach((row,i)=>(row.values||[]).forEach((v,j)=>{const e=v&&v.effectiveValue;if(e)out[t][(r0+i)+','+(c0+j)]=e.numberValue!==undefined?e.numberValue:e.stringValue!==undefined?e.stringValue:e.boolValue;}));}}
  return out;
}

    haircut:gc(12)===undefined?0.7:n(gc(12)),gap:n(gc(13)),insured:gc(14)?String(gc(14)):'',saveGoal:n(gc(15))||100000000,saveWallet:String(gc(16)||'Zalopay'),saveCount:n(gc(17))||5,
    riskCap:n(gc(18))||0.15,keepM:n(gc(19))||2,matWarn:n(gc(20))||15};
  const tiers=[];for(let r=2;r<6;r++){if(T[r+',0']===undefined)continue;tiers.push({id:n(T[r+',0']),name:String(T[r+',1']||''),def:String(T[r+',2']||''),target:Math.round(n(T[r+',3'])*100)});}
