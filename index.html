  if(nr>=0)for(let r=nr+1;r<nr+10;r++){const lab=g(T,r,1);if(typeof lab!=='string'||!lab.trim())break;k.partners.push({who:lab,cap:n(g(T,r,2)),share:n(g(T,r,3))});}
  const qr=find(Q,0,/TIỀN MẶT/);if(qr>=0){k.cashM=n(g(Q,qr+1,0));k.cashCK=n(g(Q,qr+1,2));k.payable=n(g(Q,qr+1,6));k.payNote=String(g(Q,qr+2,6)||'');}
  const dr=find(Q,0,/^NGÀY$/);
  if(dr>=0)for(let r=dr+1;r<dr+400;r++){const d=g(Q,r,0);if(typeof d==='number'&&d>40000)k.days.push({d,rev:n(g(Q,r,2))});}
  k.days.sort((a,b)=>a.d-b.d);
  return k;
}
// Lưu số liệu lần đọc gần nhất trên máy: mở app là thấy ngay, đăng nhập chỉ để làm mới. Đăng xuất thì xoá.
const CACHE_KEY='thaptaisan.data', PRIV_KEY='thaptaisan.priv';
function saveCache(){try{localStorage.setItem(CACHE_KEY,JSON.stringify({d:DATA,h:HIST,c:CF,g:GOALS,l:LOANS,k:KAI,at:LIVE.at}));}catch(_){}}
function loadCache(){try{const c=JSON.parse(localStorage.getItem(CACHE_KEY)||'null');if(c&&c.d&&c.d.rows){HIST=c.h||[];CF=c.c||[];GOALS=c.g||[];LOANS=c.l||[];KAI=c.k||null;applyData(c.d);LIVE.at=c.at||0;return true;}}catch(_){}return false;}
try{PRIV=localStorage.getItem(PRIV_KEY)==='1';}catch(_){}
const IS_WEB=typeof WEB_CFG!=='undefined';
const TOKEN_KEY='thaptaisan.token';
let mcp=null, busy=false, gTok=null, tokenClient=null, installEvt=null;
if(IS_WEB){try{const t=JSON.parse(localStorage.getItem(TOKEN_KEY)||'null');if(t&&t.exp>Date.now()+60000)gTok=t;}catch(_){}}
const tokenOk=()=>!!(gTok&&gTok.exp>Date.now()+30000);
// Đăng nhập bằng mật khẩu (giống Kai Café): cổng Apps Script trả số liệu khi đúng mật khẩu; nhập một lần, máy nhớ
const PW_KEY='thaptaisan.pw';
let PW=null;
if(IS_WEB){try{PW=localStorage.getItem(PW_KEY)||null;}catch(_){}}
const authOk=()=>!!(PW&&WEB_CFG.api)||tokenOk();
async function fetchByPw(){
  const r=await fetch(WEB_CFG.api,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({api:'data',pw:PW})});
  if(!r.ok)throw new Error('Cổng số liệu trả lỗi '+r.status);
  const j=await r.json();
  if(j.err==='pw'){PW=null;try{localStorage.removeItem(PW_KEY);}catch(_){}const e=new Error('Sai mật khẩu');e.code='needs_login';e.pw=true;throw e;}
  if(!j.ok)throw new Error(String(j.err||'Cổng số liệu lỗi').slice(0,120));
  return j;
}
function dropToken(){gTok=null;try{localStorage.removeItem(TOKEN_KEY);}catch(_){}}
function initGoogle(){
  if(tokenClient)return true;
  const g=window.google&&window.google.accounts&&window.google.accounts.oauth2;
  if(!g||!WEB_CFG.clientId)return false;
  tokenClient=g.initTokenClient({client_id:WEB_CFG.clientId,scope:'https://www.googleapis.com/auth/spreadsheets.readonly',
    callback:r=>{
      if(!r||r.error){LIVE.state='err';LIVE.msg='Google chưa cấp quyền ('+((r&&r.error)||'đã hủy')+')';render();return;}
      gTok={t:r.access_token,exp:Date.now()+(+r.expires_in||3600)*1000};
      try{localStorage.setItem(TOKEN_KEY,JSON.stringify(gTok));}catch(_){}
      loadSheet(true);},
    error_callback:e=>{LIVE.state='err';LIVE.msg=e&&e.type==='popup_closed'?'Cửa sổ đăng nhập đã bị đóng':'Không mở được cửa sổ đăng nhập Google (trình duyệt có thể đang chặn popup)';render();}});
  return true;
}
function signIn(){
  if(!WEB_CFG.clientId){LIVE.state='err';LIVE.msg='Website chưa được cấu hình Google Client ID';render();return;}
  if(!initGoogle()){LIVE.state='err';LIVE.msg='Chưa tải được thư viện đăng nhập Google, kiểm tra mạng rồi thử lại';render();return;}
  tokenClient.requestAccessToken();
}
function signOut(){
  const t=gTok&&gTok.t;dropToken();
  PW=null;try{localStorage.removeItem(PW_KEY);}catch(_){}
  try{if(t&&window.google)window.google.accounts.oauth2.revoke(t,()=>{});}catch(_){}
  try{localStorage.removeItem(CACHE_KEY);}catch(_){}
  HIST=[];CF=[];GOALS=[];LOANS=[];KAI=null;LIVE.at=0;applyData(SNAP);LIVE.state='login';render();
}
async function fetchSheet(ranges,id=SHEET_ID){
  if(IS_WEB){
    if(!tokenOk()){const e=new Error('Cần đăng nhập');e.code='needs_login';throw e;}
    const q=new URLSearchParams({includeGridData:'true',fields:'sheets(properties.title,data(startRow,startColumn,rowData.values.effectiveValue))'});
    ranges.forEach(r=>q.append('ranges',r));
    const r=await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+id+'?'+q,{headers:{Authorization:'Bearer '+gTok.t}});
    if(r.status===401){dropToken();const e=new Error('Phiên hết hạn');e.code='needs_login';throw e;}
    if(r.status===403||r.status===404)throw new Error('Tài khoản Google này không có quyền xem sheet');
    if(!r.ok)throw new Error('Google Sheets trả lỗi '+r.status);
    return r.json();
  }
  const res=await mcp.callTool('Google Sheets','get_spreadsheet',{spreadsheetId:id,includeGridData:true,ranges,
    fields:['sheets.properties.title','sheets.data.startRow','sheets.data.startColumn','sheets.data.rowData.values.effectiveValue']},{cache:false});
  return res.payload||res.structuredContent||JSON.parse(res.content[0].text);
}
async function loadSheet(manual){
  if((!IS_WEB&&!mcp)||busy)return;
  if(IS_WEB&&!authOk()){LIVE.state='login';render();return;}
  busy=true;
  if(manual){LIVE.state='load';render();}
  try{
    if(IS_WEB&&PW&&WEB_CFG.api){
      const j=await fetchByPw(), main=parseSheet(j.main);
      if(j.hist)HIST=parseHist(j.hist);if(j.cf)CF=parseCF(j.cf);if(j.goals)GOALS=parseGoals(j.goals);if(j.loans)LOANS=parseLoans(j.loans);
      if(j.kai&&j.kai.sheets){try{KAI=parseKai(j.kai);KAI_ERR='';}catch(e){KAI_ERR=e.message;}}else KAI_ERR=(j.kai&&j.kai.err)||'Không đọc được sheet Kai Café';
      applyData(main);LIVE.state='ok';LIVE.at=Date.now();LIVE.msg='';LIVE.pwErr=false;saveCache();busy=false;render();return;
    }
    const main=parseSheet(await fetchSheet(RANGES));
    // các sheet phụ đọc riêng: thiếu sheet nào thì giữ số cũ của sheet đó
    const extra=await Promise.allSettled([...[HIST_RANGE,CF_RANGE,GOAL_RANGE,LOAN_RANGE].map(r=>fetchSheet([r])),fetchSheet(KAI_RANGES,KAI_ID)]);
    if(extra.some(x=>x.status==='rejected'&&x.reason&&x.reason.code==='needs_login'))throw extra.find(x=>x.reason&&x.reason.code==='needs_login').reason;
    const ok=(i,f)=>{if(extra[i].status==='fulfilled')return f(extra[i].value);};
    ok(0,v=>HIST=parseHist(v));ok(1,v=>CF=parseCF(v));ok(2,v=>GOALS=parseGoals(v));ok(3,v=>LOANS=parseLoans(v));ok(4,v=>{try{KAI=parseKai(v);KAI_ERR='';}catch(e){KAI_ERR=e.message;}});
    if(extra[4].status==='rejected')KAI_ERR=(extra[4].reason&&extra[4].reason.message)||'Không đọc được sheet Kai Café';
    applyData(main);
    LIVE.state='ok';LIVE.at=Date.now();saveCache();
  }catch(e){
    const c=e&&e.code;
    if(c==='needs_login'){LIVE.state='login';LIVE.pwErr=!!e.pw;LIVE.msg=e.pw?e.message:'';}
    else{
      LIVE.msg=c==='needs_reauth'?'Cần kết nối lại Google Sheets trong Cài đặt → Connectors':c==='server_not_connected'?'Chưa thêm connector Google Sheets':c==='not_in_manifest'||c==='approval_required'?'Chưa cho phép đọc Google Sheet. Bấm Làm mới và chọn Cho phép':((e&&e.message)||'Lỗi không rõ').slice(0,120);
      LIVE.state=(c||manual||DATA===SNAP)?'err':'ok';
    }
  }
  busy=false;render();
}
loadCache();
if(IS_WEB){
  LIVE.state=authOk()?'load':'login';
  if(authOk())loadSheet(false);
  window.addEventListener('load',()=>initGoogle());
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;render();});
  window.addEventListener('appinstalled',()=>{installEvt=null;render();});
}else (async()=>{try{const c=window.claude&&await window.claude.use('mcp');if(c){mcp=c;loadSheet(false);}}catch(_){}})();
function go(tab){S.tab=tab;render();window.scrollTo(0,0);try{history.replaceState(null,'','#'+tab);}catch(_){}}
document.addEventListener('click',e=>{
  const tb=e.target.closest('[data-tab]');if(tb){go(tb.dataset.tab);return;}
  if(e.target.closest('#privacy')){PRIV=!PRIV;try{localStorage.setItem(PRIV_KEY,PRIV?'1':'0');}catch(_){}render();return;}
  const gt=e.target.closest('[data-goto]');if(gt){go(gt.dataset.goto);return;}
  const sz=e.target.closest('[data-snooze]');if(sz){snooze(decodeURIComponent(sz.dataset.snooze),+sz.dataset.days||30);const y=window.scrollY;render();window.scrollTo(0,y);return;}
  const fb=e.target.closest('[data-filter]');if(fb){S.filter=fb.dataset.filter;render();return;}
  const tt=e.target.closest('[data-tier]');if(tt){S.filter=tt.dataset.tier;go('assets');return;}
  if(e.target.closest('[data-signin]')){signIn();return;}
  if(e.target.closest('[data-signout]')){signOut();return;}
  if(e.target.closest('#install')){if(installEvt){installEvt.prompt();installEvt.userChoice.finally(()=>{installEvt=null;render();});}return;}
  if(e.target.closest('#refresh')){
    if(IS_WEB){if(authOk())loadSheet(true);else{LIVE.state='login';render();}}
    else if(mcp)loadSheet(true);
    else{LIVE.state='err';LIVE.msg='Mở trang này trong claude.ai để nối Google Sheet';render();}
    return;}
});
document.addEventListener('submit',e=>{
  if(e.target.id!=='pwform')return;
  e.preventDefault();
  const v=(document.getElementById('pw')||{}).value||'';
  if(!v.trim())return;
  PW=v.trim();try{localStorage.setItem(PW_KEY,PW);}catch(_){}
  loadSheet(true);
});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('layer')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));}
});
document.addEventListener('input',e=>{
  const id=e.target.id;
  if(id==='sim'||id==='gap'){
    if(id==='sim')S.sim=(+e.target.value)*1e6;else S.gap=+e.target.value;
    const y=window.scrollY;render();const el=document.getElementById(id);if(el)el.focus();window.scrollTo(0,y);}
});
// tooltip dùng chung cho mọi phần tử có data-tip
const tip=document.getElementById('tip');
document.addEventListener('pointermove',e=>{
  const t=e.target.closest&&e.target.closest('[data-tip]');
  if(!t||!tip){if(tip)tip.hidden=true;return;}
  tip.textContent=t.getAttribute('data-tip');tip.hidden=false;
  const w=tip.offsetWidth,h=tip.offsetHeight;
  tip.style.left=Math.max(8,Math.min(window.innerWidth-w-8,e.clientX+14))+'px';
  tip.style.top=Math.max(8,e.clientY-h-12)+'px';
});
document.addEventListener('pointerleave',()=>{if(tip)tip.hidden=true;});
document.addEventListener('scroll',()=>{if(tip)tip.hidden=true;},{passive:true});
// kéo xuống ở đầu trang để làm mới
let ptrY=null;const ptr=document.getElementById('ptr');
document.addEventListener('touchstart',e=>{ptrY=window.scrollY<=0&&e.touches.length===1?e.touches[0].clientY:null;},{passive:true});
document.addEventListener('touchmove',e=>{if(ptrY==null||!ptr)return;const dy=e.touches[0].clientY-ptrY;if(dy<=8){ptr.hidden=true;return;}
  ptr.hidden=false;ptr.style.transform='translateY('+Math.min(dy,110)*0.5+'px)';ptr.classList.toggle('ready',dy>80);ptr.lastChild.textContent=dy>80?'Thả để làm mới':'Kéo để làm mới';},{passive:true});
document.addEventListener('touchend',()=>{if(ptrY==null||!ptr)return;const go=ptr.classList.contains('ready');ptr.hidden=true;ptr.style.transform='';ptr.classList.remove('ready');ptrY=null;
  if(go){const rb=document.getElementById('refresh');if(rb)rb.click();}});
// tự đọc lại mỗi phút khi đang mở; app chạy nền thì không đọc, mở lại (ví dụ từ màn hình chính) thì đọc ngay nếu số đã cũ hơn 1 phút
const canLoad=()=>mcp||(IS_WEB&&(gTok||PW));
setInterval(()=>{if(document.hidden)return;const a=document.activeElement;if(a&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName))return;if(canLoad())loadSheet(false);else render();},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&canLoad()&&Date.now()-LIVE.at>60000)loadSheet(false);});
render();
</script>
<script>
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
